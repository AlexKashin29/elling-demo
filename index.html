/* ---- Просчёт: очередь оценки ТЗ в ИЦ с SLA (отклик 4ч + просчёт 3 дн) — лечит бутылочное горлышко конверсии ---- */
const EST_SRC={tender:'тендер ЕИС',mail:'почтовый шлюз',deal:'из сделки',call:'звонок'};
const EST_ST={new:['В очереди','var(--warn)'],wip:['В работе','var(--steel)'],done:['Просчитано','var(--good)'],declined:['Отклонено','var(--muted)']};
function estById(id){ return (S.estimates||[]).find(e=>e.id===id); }
/* Возраст заявки — от времени создания, а не поле в данных.
   Было: новый просчёт создавался с ageMin:0, и ЭТО ЧИСЛО НИКТО НЕ УВЕЛИЧИВАЛ.
   Часы SLA не шли: заявка, поданная сегодня, вечно показывала «0 минут в очереди»,
   счётчик «просрочен отклик» видел только демо-данные, а на живом заводе SLA не
   сработал бы ни разу. При этом «сделки умирают в очереди на просчёт» — боль №1,
   ради которой продукт и покупают.
   ageMin у демо-записей оставлен как запасной вариант: без него витрина
   показывала бы нули вместо живой очереди. */
function estAge(e){
  if(e && e.created){ return Math.max(0, Math.round((Date.now() - e.created)/60000)); }
  return (e && e.ageMin) || 0;
}
function estAckLeft(e){ return e.ackSlaMin - estAge(e); }
function estDueLeft(e){ return e.estSlaMin - estAge(e); }
function estAckOverdue(e){ return e.status==='new' && estAckLeft(e)<0; }
function estDueOverdue(e){ return (e.status==='new'||e.status==='wip') && estDueLeft(e)<0; }
function estOverdue(e){ return estAckOverdue(e)||estDueOverdue(e); }
function estAlerts(){ return (S.estimates||[]).filter(estOverdue).length; }
function fmtDur(m){ m=Math.round(Math.abs(m)); const d=Math.floor(m/1440),h=Math.floor(m%1440/60),mm=m%60; return d?`${d} дн ${h} ч`:h?`${h} ч ${mm} мин`:`${mm} мин`; }
// Себестоимость по трудоёмкости (н/ч × ставка ИЦ), а НЕ магические 5 000 000 ₽: раньше
// фолбэк-число уходило в ТКП как реальная цена (аудит финансов, находка о фолбэк-цене).
function estResFill(e){ const h=e.resHours!=null?e.resHours:40; const s=e.resSum!=null?e.resSum:(e.dealId&&dealById(e.dealId)?dealById(e.dealId).sum:h*1500); return [h,s]; }
// Загрузка ИЦ: очередь просчётов (не завершённых) → прогноз сроков (детерм. load.py).
function icCap(){ S.icCap=S.icCap||{eng:2,hpd:8}; return S.icCap; }
function icQueue(){
  // срочные (prio='hi') — вперёд очереди (порядок решает: срочный за крупным срывается);
  // сортировка стабильна → внутри групп порядок сохранён.
  return (S.estimates||[]).filter(e=>e.status==='new'||e.status==='wip').slice()
    .sort((a,b)=>(b.prio==='hi'?1:0)-(a.prio==='hi'?1:0))
    .map(e=>({ id:e.id, name:e.title, hours:e.resHours||0, prio:e.prio||'',
      due_days:Math.max(0, Math.round((estDueLeft(e)||0)/1440)) }));
}
// Клиентский двойник load.py.plan (офлайн-демо): та же арифметика — очередь в порядке,
// накопление н/ч, день готовности = ceil(накоплено/мощность), срыв = позже due_days.
function loadPlanClient(queue, eng, hpd){
  eng=Math.max(0,eng|0); hpd=Math.max(0,hpd|0); const cap=eng*hpd;
  const cd=(a,b)=> b>0 ? Math.floor((a+b-1)/b) : 0;
  let cum=0; const items=[];
  (queue||[]).forEach(q=>{ if(!q||typeof q!=='object') return;
    const h=Math.max(0,q.hours|0); const start=cd(cum,cap); cum+=h; const done=cd(cum,cap);
    const du=q.due_days; const due=(du!==null&&du!=='')?(du|0):-1;
    items.push({id:String(q.id||''),name:String(q.name||''),hours:h,start_day:start,done_day:done,due_days:due,overdue:due>=0&&done>due,slack:due>=0?(due-done):-999});
  });
  return {daily_capacity:cap,engineers:eng,hours_per_day:hpd,total_hours:cum,total_days:items.length?items[items.length-1].done_day:0,items,overdue:items.filter(x=>x.overdue).length,count:items.length};
}
async function loadPlan(){
  const c=icCap(); const queue=icQueue();
  if(!SRV.on){ S.icLoad=loadPlanClient(queue, c.eng, c.hpd); render(); return; }   // офлайн — считаем клиентски
  try{ const r=await fetch('/api/load/plan',{method:'POST',headers:AH({'Content-Type':'application/json'}),body:JSON.stringify({queue, engineers:c.eng, hours_per_day:c.hpd})});
    S.icLoad = r.ok ? await r.json() : null;
  }catch(_){ S.icLoad=null; } render();
}
function vLoadPanel(){
  const c=icCap(); const L=S.icLoad; const byId={}; (S.estimates||[]).forEach(e=>byId[e.id]=e);
  const cfg=`<div class="bomlink" style="margin:0 0 10px">
    <label class="roi-f" style="max-width:150px"><span>Инженеров в ИЦ</span><input type="number" data-iccap="eng" value="${c.eng}" min="0"></label>
    <label class="roi-f" style="max-width:150px"><span>Часов в день на 1</span><input type="number" data-iccap="hpd" value="${c.hpd}" min="0"></label>
    <button class="btn" data-loadplan="1" style="align-self:flex-end">Рассчитать сроки</button></div>`;
  let body='<div style="font-size:12px;color:var(--muted)">Нажмите «Рассчитать сроки» — прогноз, когда закроется каждый просчёт при текущей мощности ИЦ, и что не успевает к сроку.</div>';
  if(L&&L.items){
    const rows=L.items.map(x=>{
      const e=byId[x.id]||{}; const col=x.overdue?'var(--risk)':(x.slack>=0&&x.slack<3?'var(--warn)':'var(--good)');
      const hi=e.prio==='hi';
      return `<div class="anrow" style="grid-template-columns:1fr 70px 90px 90px 76px;cursor:default">
        <span class="annm">${hi?'<span title="срочно" style="color:var(--bad)">🔴 </span>':''}${esc(x.name||x.id)}</span>
        <span class="anh">${x.hours} н/ч</span>
        <span class="anh" style="color:${col}">день ${x.done_day}</span>
        <span class="anh" style="color:${col}">${x.overdue?'СРЫВ '+x.slack:(x.due_days>=0?'запас '+x.slack:'—')}</span>
        <button class="ic-prio ${hi?'on':''}" data-icprio="${esc(x.id)}" title="${hi?'снять срочность':'сделать срочным — двинуть в начало очереди'}">${hi?'снять':'↑ срочно'}</button></div>`;
    }).join('');
    body=`<div class="an-est" style="border:none;padding:0 0 10px">
        <div class="an-est-v" style="color:${L.overdue?'var(--risk)':'var(--good)'}">${L.overdue} <span>срыв${L.overdue===1?'':'ов'}</span></div>
        <div class="an-est-l">Мощность ИЦ: <b>${L.daily_capacity} н/ч/день</b> (${L.engineers}×${L.hours_per_day}). Очередь ${L.count} просчётов = ${L.total_hours} н/ч → закрытие за <b>${L.total_days} дн.</b> Порядок очереди решает: срочное за крупным — срывается.</div>
      </div><div class="anrows">${rows}</div>`;
  }
  return `<div class="an-panel" style="margin-bottom:16px"><div class="an-title">⏱ Загрузка ИЦ и прогноз сроков <span class="mono" style="font-size:10px;color:var(--muted)">по оценкам н/ч · детерминированно</span></div>${cfg}${body}</div>`;
}
function vEstimates(){
  const all=S.estimates||[]; const f=S.estFilter||'all';
  const shown = f==='queue'?all.filter(e=>e.status==='new')
    : f==='overdue'?all.filter(estOverdue)
    : all.slice();
  const rank={new:0,wip:1,done:2,declined:3};
  shown.sort((a,b)=>(estOverdue(b)-estOverdue(a))||((rank[a.status]??9)-(rank[b.status]??9))||(estDueLeft(a)-estDueLeft(b)));

/* ---- CRM: воронка проектных продаж ---- */
const DEAL_STAGES = [['lead','Лид','var(--muted)'],['assess','Оценка ТЗ','var(--steel)'],['kp','КП','var(--navy)'],
  ['nego','Переговоры / ВП','var(--warn)'],['contract','Контракт','var(--good)']];
const DST = Object.fromEntries(DEAL_STAGES.map(s=>[s[0],s]));
function fmtSum(v){ return v>=1e6 ? (v/1e6).toFixed(1).replace('.0','')+' млн ₽' : Math.round(v/1e3)+' тыс ₽'; }
function dealById(id){ return (S.deals||[]).find(d=>d.id===id); }
// Застой сделки: гниение воронки — главная утечка продаж. Дата последнего движения берётся
// из последней записи acts (DD.MM[.ГГ]); «сейчас» = сегодня. >14 кал. дней без движения = застряла.
function dealLastDay(d){
  const acts=d.acts||[]; if(!acts.length) return null;
  const last=String(acts[acts.length-1][0]||'');
  if(/сейчас|сегодня/i.test(last)) return nsDay(todayISO());
  const m=last.match(/(\d{1,2})\.(\d{1,2})(?:\.(\d{2,4}))?/); if(!m) return null;
  const mm=String(m[2]).padStart(2,'0'), dd=String(m[1]).padStart(2,'0');
  if(m[3]){ const y=m[3].length===2?2000+(+m[3]):+m[3]; return nsDay(y+'-'+mm+'-'+dd); }
  // год не указан: берём текущий; если получилась дата в будущем — значит запись из прошлого года
  const t=nsDay(todayISO()); const curY=+(todayISO().slice(0,4));
  let day=nsDay(curY+'-'+mm+'-'+dd);
  if(day!=null && t!=null && day>t) day=nsDay((curY-1)+'-'+mm+'-'+dd);
  return day;
}
function dealStaleDays(d){
  if(!d||d.stage==='contract'||d.stage==='lost') return 0;
  const dd=dealLastDay(d); if(dd==null) return 0;
  const days=nsDay(todayISO())-dd; return days>0?days:0;
}
function dealIsStale(d){ return dealStaleDays(d)>14; }
// DD.MM сегодняшней даты для штампа движения (сбрасывает застой).
function dealStamp(){ const t=todayISO(); const p=t.split('-'); return p[2]+'.'+p[1]+'.'+p[0].slice(2); }
const DEAL_PROB = {lead:20,assess:40,kp:60,nego:75,contract:100,lost:0};
// Единый источник вероятности (аудит финансов: два несогласованных расчёта + NaN при импорте
// сделки без prob). Берём по стадии; d.prob — только запасной, с защитой от NaN.
function dealProb(d){ const p=DEAL_PROB[d&&d.stage]; if(p!=null) return p; const n=Number(d&&d.prob); return Number.isFinite(n)?n:0; }
// Прогноз воронки = ТОЛЬКО открытые стадии (без 'contract' и 'lost'): законтрактованное
// считается committed отдельной плашкой «в контракте», иначе двойной счёт на 100%.
function dealForecast(deals){ return (deals||[]).filter(d=>d.stage!=='lost'&&d.stage!=='contract').reduce((a,d)=>a+(Number(d.sum)||0)*dealProb(d)/100,0); }
function moveDeal(d, stage){
  const from=d.stage; d.stage=stage; d.prob=DEAL_PROB[stage]!=null?DEAL_PROB[stage]:d.prob;
  const sn=s=>DST[s]?DST[s][1]:(s==='lost'?'Проиграно':s);
  d.acts=d.acts||[]; d.acts.push([dealStamp(),`${sn(from)} → ${sn(stage)}`]);   // дата-штамп сбрасывает застой
  ACTS.push(`сделка ${d.id}: ${sn(from)} → ${sn(stage)}`);
  save();
}

    <div class="board-wrap"><div class="board" style="grid-template-columns:repeat(5,minmax(210px,1fr));min-width:1080px">

        ${ds.map(d=>{ const stale=dealStaleDays(d);

const THEME_KEY = 'elling_theme';
function applyTheme(v){
  if(v) document.documentElement.dataset.theme = v;
  else delete document.documentElement.dataset.theme;
  const b = $('themeBtn'); if(b) b.textContent = v==='dark'?'☾':v==='light'?'☀':'◐';
}
function cycleTheme(){
  const cur = localStorage.getItem(THEME_KEY);
  const next = !cur ? 'dark' : cur==='dark' ? 'light' : null;
  const commit = ()=>{ if(next) localStorage.setItem(THEME_KEY, next); else localStorage.removeItem(THEME_KEY); applyTheme(next); };
  let reduce=false; try{ reduce=matchMedia('(prefers-reduced-motion:reduce)').matches; }catch(x){}
  if(reduce || typeof document.startViewTransition!=='function'){ commit(); return; }
  // плавное круговое раскрытие новой темы из центра кнопки (как в мобильных ОС)
  let cx=window.innerWidth-40, cy=44;
  try{ const b=$('themeBtn').getBoundingClientRect(); cx=b.left+b.width/2; cy=b.top+b.height/2; }catch(x){}
  const r=Math.hypot(Math.max(cx,window.innerWidth-cx),Math.max(cy,window.innerHeight-cy));
  try{
    const t=document.startViewTransition(commit);
    t.ready.then(()=>{
      document.documentElement.animate(
        {clipPath:[`circle(0px at ${cx}px ${cy}px)`,`circle(${r}px at ${cx}px ${cy}px)`]},
        {duration:560,easing:'cubic-bezier(.16,1,.3,1)',pseudoElement:'::view-transition-new(root)'});
    }).catch(()=>{});
  }catch(x){ commit(); }
}

/* ---- v1.5: онбординг — импорт реестра заказов (CSV/Excel) ---- */
function parseCSV(text){
  text = String(text).replace(/\r\n?/g,'\n').replace(/\n+$/,'');
  if(!text.trim()) return {headers:[], rows:[], skipped:0};
  const lines0 = text.split('\n').filter(l=>l.trim());
  const cut = (line, d) => {
    const out=[]; let cur='', q=false;
    for(let i=0;i<line.length;i++){ const c=line[i];
      if(q){ if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
      else { if(c==='"') q=true; else if(c===d){ out.push(cur); cur=''; } else cur+=c; } }
    out.push(cur); return out.map(s=>s.trim());
  };
  // Разделитель определяем по ВСЕМУ файлу, а не по первой строке: первая строка у
  // заводского реестра — «Реестр заказов на 2027 год», точки с запятой в ней нет,
  // и файл разбирался запятыми.
  //
  // Победитель — по «ширина × согласованность», а не по одной согласованности.
  // В реестре с разделителем «;» запятая всё равно встречается — в «Сумма, руб.»
  // и в «12 400 000,00» — и даёт по 2 колонки в БОЛЬШЕМ числе строк, чем «;» даёт
  // по 6. По голой согласованности побеждала запятая, и таблица рассыпалась.
  // Настоящая таблица — широкая: 6 колонок в 3 строках весомее 2 колонок в 4.
  // Требуем минимум две согласованные строки, иначе одна строка со случайными
  // разделителями выдаёт себя за таблицу.
  let delim = ';', width = 1, score = 0;
  for(const d of [';', '\t', ',']){
    const counts = {};
    lines0.forEach(l => { const n = cut(l, d).length; if(n>1) counts[n] = (counts[n]||0)+1; });
    for(const k of Object.keys(counts)){
      const w = +k, c = counts[k];
      if(c < 2) continue;
      if(w * c > score){ delim = d; width = w; score = w * c; }
    }
  }
  const parseLine = line => {
    const out=[]; let cur='', q=false;
    for(let i=0;i<line.length;i++){ const c=line[i];
      if(q){ if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
      else { if(c==='"') q=true; else if(c===delim){ out.push(cur); cur=''; } else cur+=c; } }
    out.push(cur); return out.map(s=>s.trim());
  };
  const lines = lines0;
  // Настоящая строка заголовков — первая, у которой столько же колонок, сколько у
  // строк данных. Реестр из Excel почти всегда начинается со строк вроде «Реестр
  // заказов на 2027 год». Беря первую строку за шапку, мы получали одну колонку,
  // а автомаппинг находил в ней слово «заказ» и назначал её номером заказа —
  // импорт молча грузил мусор, и человек узнавал об этом в «Заказах».
  let hi = lines.findIndex(l => parseLine(l).length === width);
  if(hi < 0) hi = 0;
  const headers = parseLine(lines[hi]);
  const rows = lines.slice(hi+1).map(parseLine).filter(r=>r.some(c=>c));
  return {headers, rows, skipped: hi};
}

  m.customer=find('заказчик','клиент','верф','покупател','контрагент'); m.vessel=find('судно','проект','объект');
  m.due=find('срок','дата','отгруз','deadline'); m.sum=find('сумм','цена','стоим','amount');

function doImport(){
  const {rows}=S.imp; const map=S.imp.map;
  if(!rows.length){ S.imp.msg='Нет строк для импорта.'; return; }
  const col=k=> map[k]!==''&&map[k]!=null ? +map[k] : -1;
  // Идемпотентность, как у Агента: человек нажимает «Импортировать» дважды всегда —
  // не понял, загрузилось ли. Без этого второй заход удваивает портфель, и первое
  // впечатление от продукта — «оно сломало мне данные».
  const byNum = new Map((S.orders||[]).map(o=>[String(o.num), o]));
  let n=0, upd=0;
  rows.forEach(r=>{
    const num=(col('num')>=0?r[col('num')]:'')|| String(2600+n);
    const title=(col('title')>=0?r[col('title')]:'')||'Заказ '+num;
    if(!title.trim()) return;
    const fields={num:String(num), title, customer:(col('customer')>=0?r[col('customer')]:'')||'—',
      vessel:(col('vessel')>=0?r[col('vessel')]:'')||'—', due:(col('due')>=0?r[col('due')]:'')||'—',
      sum:(col('sum')>=0?r[col('sum')]:'')||'—'};
    const has=byNum.get(String(num));
    if(has){ Object.assign(has, fields); upd++; return; }   // тот же номер — обновляем
    const o={id:'IMP'+(++S.seq), ...fields, goz:0, stage:0, risk:'ok',
      feed:[['импорт','<b>Заказ загружен из реестра</b> при онбординге',0]]};
    S.orders.push(o); byNum.set(String(num), o); n++;
  });
  ACTS.push(`импорт реестра: ${n} новых, ${upd} обновлено`);
  S.imp={text:'',rows:[],headers:[],map:{},
    msg:`✓ Импортировано: ${n} новых${upd?`, обновлено ${upd} (номера уже были)`:''}. Откройте «Заказы».`};
  save();
}

// Сравнение версий документа КД → построчный diff + черновик извещения (ГОСТ 2.503).
async function loadKbDocs(){
  const a=$('kbDiffA'), b=$('kbDiffB'); if(!a||!b) return;
  try{
    const j=await (await fetch('/api/kb/docs',{cache:'no-store',headers:AH()})).json();
    const opts=(j.docs||[]).map(d=>`<option value="${d.id}">${esc(d.name)} · ${esc(d.ts||'')}</option>`).join('')||'<option value="">нет документов</option>';
    a.innerHTML=opts; b.innerHTML=opts; if((j.docs||[]).length>1) b.selectedIndex=0, a.selectedIndex=1;  // разные по умолчанию
  }catch(_){ a.innerHTML=b.innerHTML='<option>ошибка загрузки</option>'; }
}
async function runKbDiff(){
  const a=$('kbDiffA')?.value, b=$('kbDiffB')?.value, box=$('kbDiffResult');
  if(!a||!b||!box) return;
  if(a===b){ box.innerHTML='<span style="color:var(--warn);font-size:13px">Выберите две РАЗНЫЕ редакции.</span>'; return; }
  box.innerHTML='<span style="font-size:12px;color:var(--muted)">Сравниваю…</span>';
  try{
    const d=await (await fetch(`/api/kb/diff?a=${encodeURIComponent(a)}&b=${encodeURIComponent(b)}`,{headers:AH()})).json();
    if(d.error){ box.innerHTML=`<span style="color:var(--bad)">${esc(d.error)}</span>`; return; }
    S.kbDiffCodes=d.codes||[];   // затронутые шифры → мост к позициям BOM в карточке заказа
    const kindColor={'замена':'var(--warn)','добавление':'var(--good)','исключение':'var(--risk)','без изменений':'var(--muted)'}[d.kind]||'var(--ink)';
    const hunks=(d.hunks||[]).map(h=>{
      const del=(h.old||[]).map(l=>`<div style="color:var(--risk);font-family:var(--mono);font-size:12px">− ${esc(l)}</div>`).join('');
      const add=(h.new||[]).map(l=>`<div style="color:var(--good);font-family:var(--mono);font-size:12px">+ ${esc(l)}</div>`).join('');
      const tagN={replace:'изменено',insert:'добавлено',delete:'удалено'}[h.tag]||h.tag;
      return `<div style="padding:8px 0;border-top:1px solid var(--line2)"><div style="font-size:11px;color:var(--muted)">${tagN}, строка ${h.at}</div>${del}${add}</div>`;
    }).join('');
    box.innerHTML=`<div class="ai-box" style="border-left:3px solid ${kindColor};margin:0 0 10px">
        <b>Вид изменения: <span style="color:${kindColor}">${esc(d.kind)}</span></b> · ${esc(d.note)}</div>
      ${hunks||'<span style="font-size:13px;color:var(--muted)">Документы идентичны.</span>'}
      ${d.hunks&&d.hunks.length&&canManage()?`<button class="btn" style="margin-top:10px" data-kbdiffnotice='${esc(JSON.stringify({code:(d.a_name||'').replace(/\.[^.]+$/,''),kind:d.kind,note:d.note}))}'>Создать черновик извещения</button>`:''}`;
  }catch(_){ box.innerHTML='<span style="color:var(--bad)">Сервер недоступен</span>'; }
}

// Режимы: ОСН 20/10/0; УСН «без НДС» (ст.346.11); УСН 5/7% (с 01.01.2025 при доходе >60 млн).
const TAX_MODES = {
  osn20:{rate:20, label:'в т. ч. НДС 20%', col:'Цена, руб. (с НДС 20%)'},
  osn10:{rate:10, label:'в т. ч. НДС 10%', col:'Цена, руб. (с НДС 10%)'},

}

/* Сумма прописью — на документах обязательна, и её отсутствие сразу выдаёт
   «веб-страницу» вместо документа. Рубли, до миллиардов. */
function sumWords(n){
  n = Math.round(+n||0); const kop = 0;
  const u=['','один','два','три','четыре','пять','шесть','семь','восемь','девять',
    'десять','одиннадцать','двенадцать','тринадцать','четырнадцать','пятнадцать',
    'шестнадцать','семнадцать','восемнадцать','девятнадцать'];
  const uf=['','одна','две']; // тысячи — женский род
  const d=['','','двадцать','тридцать','сорок','пятьдесят','шестьдесят','семьдесят','восемьдесят','девяносто'];
  const h=['','сто','двести','триста','четыреста','пятьсот','шестьсот','семьсот','восемьсот','девятьсот'];
  const plural=(x,one,few,many)=>{ const m=x%100, l=x%10;
    return (m>=11&&m<=14)?many : l===1?one : (l>=2&&l<=4)?few : many; };
  const triple=(x,fem)=>{ const out=[];
    out.push(h[Math.floor(x/100)]);
    const t=x%100;
    if(t>=20){ out.push(d[Math.floor(t/10)]); const l=t%10; out.push(fem&&l<=2?uf[l]:u[l]); }
    else if(t>0){ out.push(fem&&t<=2?uf[t]:u[t]); }
    return out.filter(Boolean).join(' '); };
  if(n===0) return 'ноль рублей 00 копеек';
  const bil=Math.floor(n/1e9), mil=Math.floor(n/1e6)%1000, th=Math.floor(n/1e3)%1000, r=n%1000;
  const parts=[];
  if(bil) parts.push(triple(bil,false), plural(bil,'миллиард','миллиарда','миллиардов'));
  if(mil) parts.push(triple(mil,false), plural(mil,'миллион','миллиона','миллионов'));
  if(th)  parts.push(triple(th,true),  plural(th,'тысяча','тысячи','тысяч'));
  if(r)   parts.push(triple(r,false));
  const words = parts.filter(Boolean).join(' ');
  return words.charAt(0).toUpperCase()+words.slice(1)+' '+plural(n,'рубль','рубля','рублей')
    +' '+String(kop).padStart(2,'0')+' копеек';
}

  if(!SRV.on){

function vRadar(){
  const all = S.projects.flatMap(p=>p.positions);
  const alerts = all.filter(x=>x.st!=='ok').length;
  // дайджест «требуют действий»: все позиции под угрозой по всем проектам, перезаложено → под угрозой,
  // те, что ближе к тендеру (стадия правее) — выше. Продажнику видно, куда звонить сегодня.
  const rank={lost:0, warn:1};
  const hot=S.projects.flatMap(p=>p.positions.filter(x=>x.st!=='ok').map(x=>({p,x})))
    .sort((a,b)=>(rank[a.x.st]-rank[b.x.st]) || ((b.p.stage||0)-(a.p.stage||0)));
  const digest = hot.length ? `<div class="panel" style="margin-bottom:16px;border-color:color-mix(in srgb,var(--risk) 30%,transparent)">
      <h3>Требуют действий сейчас <span class="cnt">${hot.length}</span> <span style="font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:400">· перезаложенные и ближе к тендеру — выше</span></h3>
      ${hot.map(({p,x})=>`<div class="bl-row" style="padding:9px 2px;gap:10px;align-items:baseline;flex-wrap:wrap">
        <span class="stchip" style="flex:none;color:${PST[x.st][0]};border:1px solid ${PST[x.st][0]}">${PST[x.st][1]}</span>
        <span style="flex:none;font-weight:640;color:var(--ink);font-size:13px">${esc(x.nm)}</span>
        <span style="flex:1;min-width:0;font-size:12px;color:var(--muted)">${esc(p.name)} · ${esc(RSTAGES[p.stage]||'—')}${x.note?` · ${esc(x.note)}`:''}</span>
        <button class="btn" style="flex:none;padding:5px 12px;font-size:12px" data-mktask="${esc(p.name)}|${esc(x.nm)}">→ Задача продажам</button></div>`).join('')}
    </div>` : `<div class="panel" style="margin-bottom:16px"><div class="zero" style="padding:6px 2px">Все позиции держатся — перезаложенных нет. Радар следит дальше.</div></div>`;
  return `${radarForm()}
    <div class="stats" style="margin-bottom:16px">
      <div class="stat"><div class="v">${S.projects.length}</div><div class="l">проектов судов под наблюдением</div></div>
      <div class="stat"><div class="v">${all.length}</div><div class="l">наших позиций в закладках</div></div>
      <div class="stat"><div class="v" style="color:${alerts?'var(--risk)':'var(--good)'}">${alerts}</div><div class="l">требуют действий продаж</div></div>
    </div>
    ${digest}
    ${S.projects.map(p=>`<div class="panel" style="margin-bottom:12px">
      <h3 style="display:flex;gap:10px;flex-wrap:wrap;align-items:baseline">${esc(p.name)}
        <span style="font-size:12px;color:var(--muted);font-weight:400">${esc(p.bureau)} · ${esc(p.vessels)}</span></h3>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 10px">
        ${RSTAGES.map((s,i)=>`<span style="font-family:var(--mono);font-size:10px;padding:3px 10px;border-radius:99px;
          border:1px solid ${i===p.stage?'var(--accent)':'var(--line)'};
          color:${i===p.stage?'var(--accent)':'var(--muted)'};
          ${i===p.stage?'background:var(--accent-soft);font-weight:700':''}">${i<p.stage?'✓ ':''}${s}</span>`).join('')}
      </div>
      ${p.positions.map(x=>`<div style="display:flex;gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line2);flex-wrap:wrap">
        <span style="font-weight:640;color:var(--ink);font-size:13.5px">${esc(x.nm)}</span>
        <span class="stchip" style="color:${PST[x.st][0]};border:1px solid ${PST[x.st][0]}">${PST[x.st][1]}</span>
        ${x.st!=='ok'?`<button class="btn" style="padding:5px 12px;font-size:12px" data-mktask="${esc(p.name)}|${esc(x.nm)}">→ Задача продажам</button>`:''}
        <span style="flex-basis:100%;font-size:12.5px;color:var(--ink2)">${esc(x.note)}</span>
      </div>`).join('')}
      ${p.positions.length?'':'<div class="empty" style="margin:8px 0">позиций пока нет — добавьте те, что заложены проектантом</div>'}
      <div class="addline" style="margin-top:10px;gap:8px;flex-wrap:wrap">
        <input id="pf-${esc(p.id)}" placeholder="Наша позиция: Электронасос ЦВС-400/40" style="flex:2;min-width:200px">
        <select id="pfst-${esc(p.id)}" style="flex:0 0 auto;padding:8px 10px;font:inherit;font-size:13px;
          background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px">
          ${Object.entries(PST).map(([k,v])=>`<option value="${k}">${v[1]}</option>`).join('')}</select>
        <input id="pfn-${esc(p.id)}" placeholder="Откуда сигнал: ИТТ проектанта / звонок ГИПу / тендер" style="flex:2;min-width:200px">
        <button class="btn" data-posadd="${esc(p.id)}">+ позиция</button>
      </div>
    </div>`).join('')}
    ${S.projects.length?'':'<div class="empty">проектов под наблюдением пока нет — заведите первый, и радар начнёт следить за вашими позициями</div>'}
    <p class="flow-hint">Радар следит за проектами судов от техпроекта до тендера: позицию, заложенную проектантом, могут тихо заменить на стадии РКД — без пересмотра техпроекта. Сигналы приходят из извещений РКД, тендерных документов и контактов с бюро. Жёлтое и красное — повод для звонка ГИПу сегодня, а не на тендере.</p>`;
}

function vToday(){
  const me = S.currentUser, p = PEOPLE[me];
  const wait = S.tasks.filter(t=>t.col==='rev'&&t.who===me);
  const od = t => { const di = dueInfo(t); return di && di.over ? 0 : 1; };
  const queue = S.tasks.filter(t=>(t.col==='open'||t.col==='wip')&&t.who===me)
    .sort((a,b)=>od(a)-od(b)||(a.sla?0:1)-(b.sla?0:1)||(a.prio==='hi'?0:1)-(b.prio==='hi'?0:1));
  const events = S.orders.flatMap(o=>o.feed.map(f=>({o,f}))).slice(-6).reverse();
  const wcard = (t,urgent)=>{
    const pa = primAction(t); const o = orderOfTask(t);
    return `<div class="wcard ${urgent?'urgent':''}" data-task="${t.key}">
      <div class="body"><span class="k">${t.key}${o?` · заказ №${o.num}`:''}</span>
        <div class="t">${esc(t.ttl)}</div>
        <div class="why">${t.col==='rev'?'<b>ждёт вашего решения</b> — дальше без вас не двинется':
          t.col==='wip'?'в работе у вас':'в вашей очереди'}${t.sla?` · <b>${t.sla}</b>`:''} ${dueBadge(t)}</div></div>
      ${pa?`<button class="btn big" data-move="${t.key}|${pa[0]}">${pa[1]}</button>`:''}</div>`;
  };
  const isBoss = (p.lvl!=null && p.lvl<=2);   // директор, зам, руководители отделов — управленческий вид
  const inIC = /инженерн/i.test(p.dept||'');  // сроки проработки изделий — только инженерному центру
  const nsdl = (inIC && !isBoss) ? nsMyDeadlines(me) : {over:[],soon:[]};
  const nsCard = (inIC && !isBoss) ? `<div class="tsec" style="margin-top:18px"><h3>Проработка изделий — сроки ${(nsdl.over.length+nsdl.soon.length)?`<span class="cnt">${nsdl.over.length+nsdl.soon.length}</span>`:''}</h3>
    ${nsdl.over.concat(nsdl.soon).slice(0,6).map(x=>{ const over=nsIsOverdue(x.it); const sm=NS_STATUS[x.it.status]||NS_STATUS.todo;
      const cs=nsCriterionState(x.st,x.it);
      const csx = cs.state==='blocked' ? ` · <span class="ns-dep blocked" style="padding:0 5px">⛓ ждёт: ${esc(cs.waitFor.join(', '))}</span>` : cs.state==='ready' ? ` · <span class="ns-dep ready" style="padding:0 5px">готов к старту</span>` : '';
      // «одна большая кнопка»: двигаем критерий прямо из «Сегодня». Заблокированный зависимостями — только открыть.
      const adv={todo:['Взять в работу','wip'],wip:['На проверку','check'],check:['Готово ✓','done']}[x.it.status];
      const advBtn = (cs.state!=='blocked' && adv) ? `<button class="btn big" data-nsadvance="${x.st.id}:${x.it.id}">${adv[0]}</button>` : `<span class="stchip">открыть →</span>`;
      return `<div class="wcard ${over?'urgent':''}" data-nav2="ns" style="cursor:pointer"><div class="body"><span class="k">${esc(x.st.name)}</span><div class="t">${esc(x.it.title||'')}</div><div class="why">${over?'<b>просрочено</b>':'срок'} ${nsFmtDay(x.d)} · ${sm[0]}${csx}</div></div>${advBtn}</div>`; }).join('')||'<div class="zero">Нет ближайших сроков проработки.</div>'}</div>` : '';
  // радар для продажника: перезаложенные/под угрозой позиции — прямо в дневном экране (боль продаж)
  const inSales = /продаж/i.test(p.dept||'');
  const rHot = (inSales && !isBoss) ? (S.projects||[]).flatMap(pr=>(pr.positions||[]).filter(x=>x.st!=='ok').map(x=>({pr,x})))
    .sort((a,b)=>(({lost:0,warn:1}[a.x.st])-({lost:0,warn:1}[b.x.st])) || ((b.pr.stage||0)-(a.pr.stage||0))) : [];
  const radarCard = (inSales && !isBoss) ? `<div class="tsec" style="margin-top:18px"><h3>Радар закладок — требуют действий ${rHot.length?`<span class="cnt">${rHot.length}</span>`:''}</h3>
    ${rHot.slice(0,6).map(({pr,x})=>`<div class="wcard ${x.st==='lost'?'urgent':''}" data-nav2="radar" style="cursor:pointer"><div class="body"><span class="k">${esc(x.nm)}</span><div class="t">${esc(pr.name)} · ${esc(RSTAGES[pr.stage]||'—')}</div><div class="why"><b style="color:${PST[x.st][0]}">${PST[x.st][1]}</b>${x.note?' · '+esc(x.note):''}</div></div><button class="btn big" data-mktask="${esc(pr.name)}|${esc(x.nm)}">→ Задача</button></div>`).join('')||'<div class="zero">Все позиции держатся — перезаложенных нет.</div>'}</div>` : '';
  // снабжение для закупщика: истекающие/просроченные сертификаты РМРС + проблемы реестровости ПП 719
  const inSupply = /закуп|снабж/i.test(p.dept||'');
  const supHot = (inSupply && !isBoss) ? (function(){
    const cs=(S.certs||[]).filter(c=>certDays(c)<180).map(c=>({kind:'cert', c, d:certDays(c)})).sort((a,b)=>a.d-b.d);
    const sp=(S.suppliers||[]).filter(s=>s.reg!=='ok').map(s=>({kind:'sup', s}));
    return {cs, sp, n:cs.length+sp.length};
  })() : {cs:[],sp:[],n:0};
  const supplyCard = (inSupply && !isBoss) ? `<div class="tsec" style="margin-top:18px"><h3>Снабжение — под контролем ${supHot.n?`<span class="cnt">${supHot.n}</span>`:''}</h3>
    ${supHot.cs.slice(0,4).map(({c,d})=>`<div class="wcard ${d<0?'urgent':''}" data-nav2="supply" style="cursor:pointer"><div class="body"><span class="k">Сертификат РМРС</span><div class="t">${esc(c.name)}</div><div class="why"><b style="color:${d<0?'var(--risk)':'var(--warn)'}">${d<0?'просрочен '+(-d)+' дн — продукцию не примут':'истекает через '+d+' дн'}</b> · повторная сертификация ~400 тыс ₽</div></div><span class="stchip">открыть →</span></div>`).join('')}
    ${supHot.sp.slice(0,3).map(({s})=>`<div class="wcard urgent" style="cursor:default"><div class="body"><span class="k">ПП 719 · реестровость</span><div class="t">${esc(s.position)} · заказ №${esc(s.order)}</div><div class="why"><b style="color:${REG_ST[s.reg][0]}">${REG_ST[s.reg][1]}</b>${s.repl&&s.repl!=='—'?' · есть согласованная замена: '+esc(s.repl):''}</div></div><button class="btn big" data-supalert="${esc(s.id)}">→ Задача</button></div>`).join('')}
    ${supHot.n?'':'<div class="zero">Сертификаты в силе, реестровость в порядке.</div>'}</div>` : '';
  const pulse = isBoss ? (()=>{
    const ords=S.orders||[];
    const cOk=ords.filter(o=>o.risk==='ok').length, cWarn=ords.filter(o=>o.risk==='warn').length, cRisk=ords.filter(o=>o.risk==='risk').length;
    const forecast=dealForecast(S.deals);
    const estAll=S.estimates||[]; const ackOver=estAll.filter(e=>e.status==='new'&&estAckLeft(e)<0).length;
    const slaPct=estAll.length?Math.round((estAll.length-ackOver)/estAll.length*100):100;
    const cc=c=>`color:${c};-webkit-text-fill-color:${c}`;
    const nsOver = inIC ? nsList().reduce((s,st)=>s+(st.items||[]).filter(nsIsOverdue).length,0) : 0;
    const nsConf = inIC ? nsConflictCount() : 0;
    const icf = inIC ? nsICForecast() : null;
    const attn=[
      ...ords.filter(o=>o.risk==='risk').map(o=>({t:'Срыв срока',n:'№'+o.num+' · '+o.title,c:'var(--risk)',go:'flow'})),
      ...ords.filter(o=>o.risk==='warn').map(o=>({t:'Риск срока',n:'№'+o.num+' · '+o.title,c:'var(--warn)',go:'flow'})),
      ...(ackOver?[{t:'Просрочен отклик ИЦ',n:ackOver+' заявок ждут просчёта дольше 4 ч',c:'var(--risk)',go:'estimates'}]:[]),
      ...(nsOver?[{t:'Просрочка проработки изделий',n:nsOver+' критериев проработки просрочено по изделиям',c:'var(--risk)',go:'ns'}]:[]),
      ...(nsConf?[{t:'Конфликт сроков проработки',n:nsConf+' критериев стоят раньше своих предшественников — план нереалистичен',c:'var(--warn)',go:'ns'}]:[]),
      ...(icf&&icf.level==='over'?[{t:'ИЦ перегружен',n:'единая очередь '+icf.totalDays+' инженеро-дней (~'+icf.perEng+' раб.дн на инженера) — новые сделки под риском срыва: двигать сроки / усилить ИЦ',c:'var(--risk)',go:'ns'}]:[]),
      ...(()=>{ const lost=(S.projects||[]).flatMap(pr=>pr.positions||[]).filter(x=>x.st==='lost').length;
        return lost?[{t:'Перезакладка в радаре',n:lost+' наших позиций перезаложены на конкурента — судьба сделок решается до тендера, нужен ход продаж',c:'var(--risk)',go:'radar'}]:[]; })(),
      ...(()=>{ const exp=(S.certs||[]).filter(c=>certDays(c)<0).length;
        return exp?[{t:'Сертификат РМРС просрочен',n:exp+' сертификат(ов) аннулированы — продукцию не примут при освидетельствовании судна',c:'var(--risk)',go:'supply'}]:[]; })(),
      ...(()=>{ const des=(S.notices||[]).filter(noticeDesync).length;
        return des?[{t:'Модель не сведена с архивом',n:des+' извещений внедрены, но ЭМ не приведена к архиву — риск приёмки ВП и отгрузки по неверной КД',c:'var(--warn)',go:'notices'}]:[]; })(),
    ].filter(a=>canView(a.go));   // руководителю отдела — только алерты, во что он может провалиться (без отскоков в чужие модули)
    return `<div class="stats" style="margin:8px 0 16px">
      <div class="stat"><div class="v">${ords.length}</div><div class="l">заказов в портфеле</div></div>
      <div class="stat"><div class="v" style="${cc('var(--good)')}">${cOk}</div><div class="l">в графике</div></div>
      <div class="stat"><div class="v" style="${cc('var(--warn)')}">${cWarn}</div><div class="l">риск срока</div></div>
      <div class="stat"><div class="v" style="${cc('var(--risk)')}">${cRisk}</div><div class="l">срыв — вмешаться</div></div>
      <div class="stat"><div class="v" style="${cc('var(--accent)')}">${canFin()?fmtSum(forecast):'•••'}</div><div class="l">прогноз воронки</div></div>
      <div class="stat"><div class="v" style="${cc(slaPct>=80?'var(--good)':'var(--warn)')}">${slaPct}%</div><div class="l">просчёт в SLA (4 ч)</div></div>
    </div>
    ${attn.length?`<div class="tsec" style="margin-bottom:18px"><h3>Требует внимания сейчас <span class="cnt">${attn.length}</span></h3>
      ${attn.map(a=>`<div class="wcard" data-nav2="${a.go}" style="cursor:pointer">
        <div class="body"><span class="k" style="color:${a.c};font-weight:700">${a.t}</span><div class="t">${esc(a.n)}</div></div>
        <span class="stchip" style="color:${a.c};border:1px solid ${a.c}">открыть →</span></div>`).join('')}</div>`
    :`<div class="zero" style="margin-bottom:18px">Портфель в графике — ничего не требует вмешательства.</div>`}`;
  })() : '';
  return `<div class="hello hello-ship">${p.lvl===0?'Портфель под контролем':p.lvl===1?'Дирекция':p.lvl===2?('Отдел · '+(p.dept||'')):'Добрый день'}, ${p.full}
      <small>${p.role} · ${isBoss?'состояние портфеля и что требует вмешательства':'что требует вашего участия сегодня'}</small>
      <svg class="hello-ship-art" viewBox="0 0 240 90" aria-hidden="true"><use href="#i-ship-hero"/></svg></div>
    ${hubTiles()}
    ${pulse}
    ${isBoss ? `<div class="tsec"><h3>Последние события по заказам</h3>
        <div class="evfeed">${events.map(({o,f})=>`<div class="ev"><span class="t">${esc(f[0])}</span>
          <span><b>№${esc(o.num)}</b> · ${safe(f[1])}${f[2]?'<span class="nocall">вместо звонка</span>':''}</span></div>`).join('')}</div></div>`
    : `<div class="today">
      <div>
        <div class="tsec"><h3>Ждут вашего решения ${wait.length?`<span class="cnt">${wait.length}</span>`:''}</h3>
          ${wait.map(t=>wcard(t,true)).join('')||'<div class="zero">Ничего не ждёт вашего решения.</div>'}</div>
        <div class="tsec" style="margin-top:18px"><h3>Ваша очередь ${queue.length?`<span class="cnt">${queue.length}</span>`:''}</h3>
          ${queue.map(t=>wcard(t)).join('')||'<div class="zero">✓ Очередь пуста.</div>'}</div>
        ${nsCard}
        ${radarCard}
        ${supplyCard}
      </div>
      <div class="tsec"><h3>Пока вы работали</h3>
        <div class="evfeed">${events.map(({o,f})=>`<div class="ev"><span class="t">${esc(f[0])}</span>
          <span><b>№${esc(o.num)}</b> · ${safe(f[1])}${f[2]?'<span class="nocall">вместо звонка</span>':''}</span></div>`).join('')}</div>
      </div>
    </div>`}`;
}

function vFlow(){
  return `<div class="legend">
      <span><span class="ldot" style="background:var(--good)"></span>в графике</span>
      <span><span class="ldot" style="background:var(--warn)"></span>риск срока</span>
      <span><span class="ldot" style="background:var(--risk)"></span>срыв — нужно вмешаться</span>
      <span style="margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted)">оранжевые этапы — только для ГОЗ</span></div>
    <div class="flow-wrap"><table class="flow">
      <tr><th>Заказ</th>${STAGE_NAMES.map(s=>`<th class="${s[1]?'goz':''}">${s[0]}</th>`).join('')}</tr>
      ${S.orders.map(o=>{
        // импортированный заказ может не иметь risk/stage — не роняем весь портфель
        const rk = RISK[o.risk] ? o.risk : 'ok';
        const rc = RISK[rk][0];
        const stg = Number.isFinite(o.stage) ? o.stage : 0;
        return `<tr><td class="oc" data-order="${o.id}">
          <span class="onum">№${esc(o.num)}${o.goz?' · ГОЗ':''} · <span style="color:${rc}">●</span> ${RISK[rk][1]}</span>
          <div class="onm">${esc(o.title)}</div>
          <span class="ocust">${esc(o.customer)} · ${esc(o.due)}</span>${nsOrderMini(o.num)}</td>
        ${STAGE_NAMES.map((s,i)=>{
          if(i<stg) return `<td><span class="track fill"></span><span class="dotdone"></span></td>`;
          if(i===stg) return `<td><span class="track fill half-l"></span>${i<STAGE_NAMES.length-1?'<span class="track half-r"></span>':''}
            <button class="puck" style="background:${rc}" data-order="${o.id}" title="${STAGE_NAMES[i][0]}">№${esc(o.num)}</button></td>`;
          return `<td><span class="track"></span></td>`;
        }).join('')}</tr>`;
      }).join('')}
    </table></div>
    <p class="flow-hint">Фишка заказа стоит на текущем этапе. Клик по заказу открывает его ось: этапы, задачи, лента и документы.</p>`;
}

function vBoard(){
  return chipsHTML()+`<div class="board-wrap"><div class="board">`+COLS.map(c=>{
    const ts = S.tasks.filter(t=>t.col===c.id);
    const over = c.wip && ts.length>c.wip;
    return `<div class="col" data-col="${c.id}"><h3>${c.name} · ${ts.filter(visible).length}${c.wip?` <span class="wip">${over?'⚠ ':''}WIP ${ts.length}/${c.wip}</span>`:''}</h3>
      ${ts.map(cardHTML).join('')||'<div class="empty">пусто</div>'}</div>`;
  }).join('')+`</div></div>
  <p class="flow-hint" style="margin-top:8px">Доска инженерного центра: перетаскивайте карточки между статусами; связи и сроки — в карточке задачи.</p>`;
}

/* «32 н/ч», «0,5 н/ч», «320–380 н/ч (по аналогу…)» → число */
function parseHours(s){ if(!s) return 0; const m=String(s).replace(',','.').match(/(\d+(?:\.\d+)?)/); return m?parseFloat(m[1]):0; }
function dueVal(d){ const m=String(d||'').match(/(\d{2})\.(\d{2})\.(\d{4})/); return m?(+m[3])*10000+(+m[2])*100+(+m[1]):9e9; }
function vPlan(){
  const CAP=80, HPD=8;                            // ёмкость инженера на спринт (2 недели), н/ч
  // единая очередь ИЦ: задачи доски + проработка изделий (как в nsICForecast) — иначе загрузка занижена
  const engSet=new Set(Object.keys(PEOPLE).filter(k=>S.tasks.some(t=>t.who===k&&t.col!=='done')));
  nsList().forEach(st=>{ if(st.proj&&PEOPLE[st.proj]) engSet.add(st.proj); if(st.asu&&PEOPLE[st.asu]) engSet.add(st.asu); });
  const ppl=[...engSet].filter(k=>PEOPLE[k]);
  const load=ppl.map(uid=>{ const ts=S.tasks.filter(t=>t.who===uid&&t.col!=='done');
    const taskH=ts.reduce((a,t)=>a+parseHours(t.est),0);
    const nsL=(typeof nsEngineerLoad==='function')?nsEngineerLoad(uid):{days:0,total:0};
    const nsH=(nsL.days||0)*HPD; const h=taskH+nsH;
    return {uid,h:Math.round(h*10)/10,taskH:Math.round(taskH*10)/10,nsH:Math.round(nsH*10)/10,n:ts.length,nsN:nsL.total||0,pct:Math.round(h/CAP*100)}; }).sort((a,b)=>b.pct-a.pct);
  const totH=Math.round(load.reduce((a,x)=>a+x.h,0)), capTot=Math.max(1,load.length*CAP);
  const totPct=Math.round(totH/capTot*100); const overN=load.filter(x=>x.pct>100).length;
  const mil=(S.orders||[]).filter(o=>o.stage<10).slice().sort((a,b)=>dueVal(a.due)-dueVal(b.due));
  const atRisk=mil.filter(o=>o.risk==='risk'||o.risk==='warn').length;
  const cc=c=>`color:${c};-webkit-text-fill-color:${c}`;
  const pcol=p=>p>100?'var(--risk)':p>80?'var(--warn)':'var(--good)';
  return `<div class="stats" style="margin-bottom:16px">
      <div class="stat"><div class="v" style="${cc(pcol(totPct))}">${totPct}%</div><div class="l">загрузка ИЦ на спринт</div></div>
      <div class="stat"><div class="v">${totH} н/ч</div><div class="l">в очереди · ёмкость ${capTot} н/ч</div></div>
      <div class="stat"><div class="v" style="${cc(overN?'var(--risk)':'var(--good)')}">${overN}</div><div class="l">перегружено людей</div></div>
      <div class="stat"><div class="v" style="${cc(atRisk?'var(--warn)':'var(--good)')}">${atRisk}</div><div class="l">вех под риском срока</div></div>
    </div>
    <div class="panel" style="margin-bottom:14px"><h3>Загрузка инженерного центра <span style="font-family:var(--mono);font-size:10px;color:var(--muted)">· спринт 14 · ёмкость ${CAP} н/ч · задачи + проработка изделий${canView('board')?' · клик — задачи человека':''}</span></h3>
      ${load.map(x=>`<div class="loadrow" style="align-items:center;gap:12px${canView('board')?';cursor:pointer':''}" ${canView('board')?`data-teamboard="${x.uid}"`:''}>
        <span class="nm" style="flex:0 0 178px;min-width:0">${av(x.uid)} ${esc(PEOPLE[x.uid].full)}</span>
        <span class="tm-bar" style="flex:1;margin:0"><i style="width:${Math.min(100,x.pct)}%;background:${pcol(x.pct)}"></i></span>
        <span style="flex:none;width:150px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--muted)">${x.h} н/ч${x.nsH>0?` <span title="в т.ч. проработка изделий: ${x.nsH} н/ч (${x.nsN} критериев)" style="color:var(--accent)">·${x.nsH}пр</span>`:''} · ${x.n} зад.</span>
        <span class="tm-badge ${x.pct>100?'over':''}" style="width:52px;text-align:center">${x.pct}%</span>
      </div>`).join('')||'<div class="empty">открытых задач нет — очередь пуста</div>'}
      <p style="font-size:12px;color:var(--muted);margin-top:10px">Загрузка — единая очередь ИЦ: задачи доски + проработка изделий, в н/ч. «·Nпр» — доля проработки. Перегруз (&gt;100%) — сигнал перераспределить или двигать срок заранее, а не по факту срыва.</p>
    </div>
    <div class="panel" style="margin-bottom:14px"><h3>Вехи заказов <span style="font-family:var(--mono);font-size:10px;color:var(--muted)">· ближайший срок сверху</span></h3>
      ${mil.map(o=>{ const r=RISK[o.risk]||['var(--muted)','—'];
        return `<div class="loadrow" style="align-items:center;gap:12px;cursor:pointer" data-order="${o.id}">

    </div>

  +chipsHTML()+S.epics.map(e=>{
    const ts = S.tasks.filter(t=>t.epic===e.id);

      ${ts.filter(visible).map(t=>`<div class="bl-row" data-task="${t.key}">

        <span class="prio ${t.prio==='hi'?'hi':t.prio==='lo'?'lo':'md'}">${t.prio==='hi'?'↑':t.prio==='lo'?'↓':'→'}</span>

      <div class="bl-add"><button data-addepic="${e.id}">+ задача в эпик</button></div>
    </div>`;
  }).join('');
}

// Дозагрузка полной истории ленты заказа из архива (l3_feed) по требованию: старые

// Интеграция проработки изделий с жизненным циклом заказа: изделия, привязанные к заказу
// (st.order === o.num), видны в карточке заказа со статусом; клик → в модуль проработки.

const NS_RC={risk:'var(--risk)', warn:'var(--warn)', ok:'var(--good)', done:'var(--muted)'};
const NS_RANK={risk:3, warn:2, ok:1, done:0};
function nsOrderMini(num){

  sts.forEach(s=>{ const p=nsProgress(s); done+=p.done; total+=p.total;
    const l=nsStationRisk(s).level; if((NS_RANK[l]||0)>(NS_RANK[worst]||0)) worst=l; });
  const pct=total?Math.round(done*100/total):0;
  const lbl={risk:'срыв',warn:'риск',ok:'в графике',done:'готово'}[worst]||'';
  // клик ведёт в модуль НС только тем, у кого есть к нему доступ; остальным — информативный чип без навигации
  const nav = canView('ns'); const cls = nav?'ns-mini':'ns-mini ns-mini-static';
  const attr = nav?` data-nsgoto="${esc(sts[0].id)}"`:'';
  const tip = nav?'Проработка изделий: '+done+'/'+total+' критериев · '+lbl+'. Открыть модуль проработки':'Проработка изделий: '+done+'/'+total+' критериев · '+lbl;
  return `<span class="${cls}"${attr} title="${esc(tip)}">
    <span class="ns-mini-dot" style="background:${NS_RC[worst]}"></span>изд. ${done}/${total}
    <span class="ns-mini-bar"><i style="width:${pct}%;background:${NS_RC[worst]}"></i></span></span>`;
}

// Состав изделия (BOM) — доменная сущность L3. Парсинг спецификации и digest —
// на сервере (bom.py байт-в-байт с Kotlin); здесь дерево + связь с извещением.
function l3(oid){ S._l3=S._l3||{}; S._l3[oid]=S._l3[oid]||{}; return S._l3[oid]; }
// Ленивая загрузка L3-сущностей из нормализованных таблиц (не из блоба состояния).
// Инвалидация по digest: кэш валиден, только если L.loadedDigest == текущему bomRef.digest.
async function ensureL3(oid){
  const o=S.orders.find(x=>x.id===oid); if(!o||!o.bomRef) return;
  const L=l3(oid);
  if(L.bom && L.loadedDigest===o.bomRef.digest) return;   // кэш совпадает со снимком — ок
  if(L.loading) return;                                    // уже грузится — не дёргаем дважды
  L.loading=true;
  try{
    const bm=await (await fetch('/api/bom/load?order='+encodeURIComponent(o.num),{cache:'no-store',headers:AH()})).json();
    const cd=await (await fetch('/api/cddoc/load?order='+encodeURIComponent(o.num),{cache:'no-store',headers:AH()})).json();
    const nt=await (await fetch('/api/notice/load?order='+encodeURIComponent(o.num),{cache:'no-store',headers:AH()})).json();
    L.bom=bm.nodes||[]; L.cddocs=cd.docs||[]; L.notices=nt.notices||[];
    if(L.cddocs.length){ const lk=await fetch('/api/cddoc/link-bom',{method:'POST',headers:AH({'Content-Type':'application/json'}),body:JSON.stringify({docs:L.cddocs,nodes:L.bom})}); L.cddocLink=await lk.json().catch(()=>null); }
    else L.cddocLink=null;
    L.loadedDigest=o.bomRef.digest; L.loading=false; render();
  }catch(_){ L.loading=false; }   // при ошибке кэш НЕ залипает пустым — повторим при следующем открытии
}
function vBom(o){
  const L=l3(o.id);
  // источник данных — кэш L3 (из таблиц); о.bom оставлен для совместимости со старым блобом
  const bom = L.bom||o.bom||[];
  const alert = new Set(L.bomAlert||o.bomAlert||[]);
  const cddocLink = L.cddocLink||o.cddocLink;
  const cddocs = L.cddocs||o.cddocs;
  const plmDigest = o.bomRef&&o.bomRef.plm || o.plmDigest;
  const changeNotices = L.notices||o.changeNotices||[];
  const linkByKey = {}; ((cddocLink&&cddocLink.links)||[]).forEach(l=>{ linkByKey[l.node_key]=l; });
  const hasKd = !!cddocLink;
  const tree = bom.length ? `<div class="bomtree">${bom.map(n=>{
      const hit = alert.has(n.key);
      const cd = linkByKey[n.key];
      const rev = cd ? `<span class="bomrev" title="актуальная ревизия чертежа">ред. ${esc(cd.latest_rev||'—')}</span>`
                     : (hasKd ? '<span class="bomrev nodoc" title="в реестре КД нет чертежа на эту позицию">нет чертежа</span>' : '');
      return `<div class="bomrow${hit?' hit':''}" style="padding-left:${(n.depth||0)*18+4}px">
        <span class="bomcode">${esc(n.code)}</span>
        <span class="bomname">${esc(n.name||'')}</span>
        ${rev}
        <span class="bomqty">${esc(n.qty||'')}${esc(n.unit||'')}</span>

function cfdSeries(){
  const cnt = c => S.tasks.filter(t=>t.col===c).length;
  const cur = {done:cnt('done'),rev:cnt('rev'),wip:cnt('wip'),open:cnt('open')};
  const N=14, out=[];
  for(let i=0;i<N;i++){ const t=i/(N-1); const w=k=>0.75+0.4*Math.abs(Math.sin(i*1.25+k)); // детерминированно, без random
    out.push({ done:Math.round(cur.done*(0.12+0.88*t)),
      rev:Math.max(0,Math.round(cur.rev*w(1)*(0.4+0.6*t))),
      wip:Math.max(0,Math.round(cur.wip*w(0)*(0.55+0.45*t))),
      open:Math.max(0,Math.round(cur.open*w(2)*(0.6+0.4*t))) }); }
  out[N-1]={...cur};
  return out;
}
function chartCFD(){
  const data = CFD_DATA = cfdSeries();
  const W=720,H=250,PL=34,PR=14,PT=14,PB=26, iw=W-PL-PR, ih=H-PT-PB;
  const totals = data.map(d=>d.done+d.rev+d.wip+d.open);
  const ymax = Math.max(4, ...totals);
  const X = i => PL + iw*i/(data.length-1);
  const Y = v => PT + ih*(1 - v/ymax);
  // накопление снизу: done, +rev, +wip, +open
  const cum = data.map(d=>{ let a=0; const o={}; FLOW_STATES.forEach(([k])=>{a+=d[k]; o[k]=a;}); return o; });
  const bands = FLOW_STATES.map(([k,,c],bi)=>{
    const top = data.map((_,i)=>[X(i), Y(cum[i][k])]);
    const prevKey = bi>0 ? FLOW_STATES[bi-1][0] : null;
    const bottom = data.map((_,i)=>[X(i), Y(prevKey? cum[i][prevKey] : 0)]).reverse();
    const pts = top.concat(bottom).map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    return `<polygon points="${pts}" style="fill:${c};opacity:.9;stroke:var(--panel);stroke-width:2"/>`;
  }).join('');
  const grid = [0,.25,.5,.75,1].map(f=>{ const y=PT+ih*f; const v=Math.round(ymax*(1-f));
    return `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" style="stroke:var(--line2);stroke-width:1"/>
      <text x="${PL-6}" y="${y+4}" text-anchor="end" style="fill:var(--muted);font-size:10px;font-family:var(--mono)">${v}</text>`; }).join('');
  const xlab = [0,4,8,13].map(i=>`<text x="${X(i)}" y="${H-8}" text-anchor="middle" style="fill:var(--muted);font-size:10px;font-family:var(--mono)">${i===13?'сегодня':'−'+(13-i)+'д'}</text>`).join('');
  const legend = FLOW_STATES.slice().map(([k,l,c])=>`<span class="lg"><i style="background:${c}"></i>${l} · ${data[13][k]}</span>`).join('');
  return `<div class="chart-head"><h3>Диаграмма потока (CFD) <span class="ch-sub">задачи по статусам · 14 дней</span></h3>
      <div class="legend2">${legend}</div></div>
    <div class="chart-box"><svg id="cfdChart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      ${grid}${bands}${xlab}
      <line id="cfdCross" x1="0" y1="${PT}" x2="0" y2="${PT+ih}" style="stroke:var(--ink);stroke-width:1;opacity:0;pointer-events:none"/>
      <rect x="${PL}" y="${PT}" width="${iw}" height="${ih}" fill="transparent" id="cfdHit"/>
    </svg><div class="chart-tip" id="cfdTip"></div></div>
    <p class="ch-note">Расширение полосы «Очередь/В работе» — растёт незавершёнка, риск затора. Ровный рост «Готово» — стабильная пропускная способность.</p>`;
}
function chartThroughput(){

  const weeks=base.map((b,i)=>Math.max(1, b + (i===base.length-1? Math.max(0,doneNow-4):0)));
  const mx=Math.max(...weeks), W=720,H=150,PL=30,PB=22,PT=10,iw=W-PL-14,ih=H-PT-PB, bw=iw/weeks.length*0.5;
  const bars=weeks.map((v,i)=>{ const x=PL+iw*(i+0.5)/weeks.length-bw/2; const h=ih*v/mx; const y=PT+ih-h;

function tourSteps(){ return TOUR.filter(s=>canView(s.view)); }
function startTour(){ closeWelcome(); S.tour={on:true,i:0}; applyTour(); }
function endTour(){ S.tour={on:false,i:0};
  try{ document.querySelectorAll('.tour-hi').forEach(el=>el.classList.remove('tour-hi')); const tip=document.getElementById('tourTip'); if(tip) tip.remove(); }catch(e){}
}
function applyTour(){
  const steps=tourSteps(); if(!S.tour||!S.tour.on||!steps.length) return endTour();
  if(S.tour.i>=steps.length) return endTour();
  const st=steps[S.tour.i];
  if(S.view!==st.view){ S.view=st.view; render(); }
  paintTour();
}
function paintTour(){
  try{
    const steps=tourSteps(); if(!S.tour||!S.tour.on||S.tour.i>=steps.length) return;
    const st=steps[S.tour.i];
    document.querySelectorAll('.tour-hi').forEach(el=>el.classList.remove('tour-hi'));
    let tip=document.getElementById('tourTip');
    if(!tip){ tip=document.createElement('div'); tip.id='tourTip'; tip.className='tour-tip'; document.body.appendChild(tip); }
    const last=S.tour.i===steps.length-1;
    tip.innerHTML=`<div class="tt-n">Шаг ${S.tour.i+1} из ${steps.length}</div>
      <div class="tt-t">${esc(st.t)}</div><div class="tt-x">${esc(st.x)}</div>
      <div class="tt-act"><button class="btn ghost" data-tour="end">Пропустить</button>
        ${S.tour.i?'<button class="btn ghost" data-tour="prev">Назад</button>':''}
        <button class="btn" data-tour="${last?'end':'next'}">${last?'Готово':'Далее →'}</button></div>`;
    const el=document.querySelector(st.sel);
    if(el && el.getBoundingClientRect){
      el.classList.add('tour-hi');
      const r=el.getBoundingClientRect(); const th=tip.offsetHeight||190, tw=tip.offsetWidth||330;
      let top=r.bottom+12; if(top+th>window.innerHeight-8) top=Math.max(8,r.top-th-12);
      let left=Math.min(Math.max(8,r.left), window.innerWidth-tw-8);
      tip.style.top=top+'px'; tip.style.left=left+'px'; tip.style.visibility='visible';
      try{ el.scrollIntoView({behavior:'smooth',block:'center'}); }catch(x){}
    } else { tip.style.top='50%'; tip.style.left='50%'; tip.style.transform='translate(-50%,-50%)'; tip.style.visibility='visible'; }
  }catch(e){}
}

// Загрузка файла ТЗ (DOCX/PDF/TXT) → извлечение текста на сервере → в поиск аналогов.
async function tzExtract(f){
  S.kbMsg='Извлекаю текст ТЗ из «'+f.name+'»…'; render();
  try{ const buf=await f.arrayBuffer();
    const r=await fetch('/api/tz/extract',{method:'POST',headers:AH({'X-Filename':encodeURIComponent(f.name)}),body:buf});
    const j=await r.json().catch(()=>({}));
    if(r.ok && (j.text||'').trim()){
      S.kbq=j.text.slice(0,4000); S.kbMsg=''; S.kbAI=true; S.kbThinking=false;
      searchFiles(); analogRank(); render();
    } else { S.kbMsg=j.error||('Из файла «'+f.name+'» не извлёкся текст (для PDF-сканов нужен OCR).'); render(); }
  }catch(_){ S.kbMsg='Сервер недоступен — не удалось извлечь ТЗ.'; render(); }
}
async function uploadDoc(f){
  try{
    S.kbMsg = `Загружаю «${f.name}»…`; render();
    const r = await fetch('/api/docs', {method:'POST',
      headers:AH({ 'X-Filename': encodeURIComponent(f.name),
                'X-User': encodeURIComponent(PEOPLE[S.currentUser].full+' · '+PEOPLE[S.currentUser].role) }),
      body: await f.arrayBuffer()});
    if(!r.ok){ const j = await r.json().catch(()=>({})); S.kbMsg = 'Ошибка загрузки: '+(j.error||r.status); render(); return; }
    const m = await r.json();
    S.docs.unshift({tp:(m.ext||'файл').toUpperCase(), nm:`${m.name} — загружен пользователем`, vv:m.note, tags:m.name});
    ACTS.push(`загружен документ: ${m.name}`);
    S.kbMsg = `«${m.name}»: ${m.note}. Документ проиндексирован — ищите по содержимому.`;
    save(); render();
  }catch(e){ S.kbMsg = 'Ошибка загрузки — сервер недоступен'; setSrv(false); render(); }
}

document.addEventListener('change', e=>{
  if(e.target.id==='upFile'){ const f=e.target.files[0]; e.target.value=''; if(f) uploadDoc(f); return; }
  if(e.target.id==='tzFile'){ const f=e.target.files[0]; e.target.value=''; if(f) tzExtract(f); return; }
  if(e.target.id==='bkRestore'){ const f=e.target.files[0]; e.target.value=''; if(f){
    if(!confirm('Восстановить базу из файла «'+f.name+'»?\n\nТекущее состояние заменится. Перед этим будет сделан страховочный снимок.')) return;
    S.bkMsg='Проверяю файл и восстанавливаю…'; render();
    f.arrayBuffer().then(buf=>fetch('/api/backup/restore',{method:'POST',headers:AH(),body:buf}))
      .then(r=>r.json()).then(r=>{
        if(r.ok){ S.bkMsg='✓ База восстановлена. Обновляю…'; render(); setTimeout(()=>location.reload(),900); }
        else { S.bkMsg='Не восстановлено: '+((r.error||'')); render(); }
      }).catch(()=>{ S.bkMsg='Ошибка — восстанавливает только директор.'; render(); });
  } return; }
  if(e.target.id==='impFile'){ const f=e.target.files[0]; e.target.value=''; if(f){
    // .xlsx — это zip-архив. Скормить его разбору CSV значит показать человеку
    // мусор вместо реестра и заставить гадать, что не так. Говорим прямо.
    if(/\.xlsx?$/i.test(f.name)){
      S.imp={text:'',headers:[],rows:[],map:{},
        msg:`Файл «${f.name}» — книга Excel, а не таблица с разделителями. `
          + `В Excel: Файл → Сохранить как → «CSV (разделители — запятые)», и загрузите его. `
          + `Кириллицу и точку с запятой мы понимаем.`};
      render(); return;
    }
    const done=(txt,enc)=>{ const {headers,rows,skipped}=parseCSV(txt); S.imp={text:'',headers,rows,map:autoMap(headers),
      msg:rows.length?`Файл «${f.name}» разобран${enc?' ('+enc+')':''}`
          + (skipped?`, пропущено строк шапки: ${skipped}`:'') + '.'
        :'Файл пуст или не распознан.'}; render(); };
    const rd=new FileReader();
    rd.onload=()=>{ const utf=rd.result;
      // реальные Excel-CSV на RU-Windows часто в cp1251 → детект кракозябр и перечитка (ревью v1.5)
      if(utf.includes('\uFFFD')){ const rd2=new FileReader();
        rd2.onload=()=>done(rd2.result,'Windows-1251'); rd2.onerror=()=>done(utf); rd2.readAsText(f,'windows-1251'); }
      else done(utf); };
    rd.readAsText(f,'utf-8'); } return; }
  const im=e.target.closest('[data-impmap]');
  if(im){ S.imp.map[im.dataset.impmap]=e.target.value; return; }
  if(e.target.id==='userSel'){ S.currentUser=e.target.value; S.navOpen=navOpenForRole(S.currentUser); if(!canView(S.view)) S.view='today'; render(); return; }
  if(e.target.id==='elxFile'){ const f=e.target.files[0]; e.target.value=''; if(f) elxImportReal(f); return; }
  if(e.target.id==='benchDealSel'){ const id=e.target.value; S.benchDeal=id||null;
    if(id){ const m=dealMatchBench(dealById(id)); S.benchCmp=m?m.b.id:null; } else { S.benchCmp=null; }
    render(); return; }
  const rc = e.target.closest('[data-rule]');
  if(rc){ const r=(S.rules||[]).find(x=>x.id===rc.dataset.rule); if(r){ r.enabled = e.target.checked?1:0;
    ACTS.push(`правило «${r.name.slice(0,24)}» ${r.enabled?'включено':'выключено'}`); save(); } return; }
  if(e.target.id==='dealStage'){ const d=dealById($('drawer').dataset.deal||''); if(d){ moveDeal(d, e.target.value); render(); openDeal(d.id); } return; }
  const t = task($('drawer').dataset.task||'');
  if(t && $('drawer').classList.contains('open')){
    if(e.target.id==='f_col'){ moveTask(t,e.target.value,'вручную'); save(); render(); openTask(t.key); return; }
    if(e.target.id==='f_who'){ t.who=e.target.value; t.log.push(`исполнитель: ${PEOPLE[t.who].full}`); save(); render(); return; }
    if(e.target.id==='f_prio'){ t.prio=e.target.value; save(); render(); return; }
    if(e.target.id==='f_epic'){ t.epic=e.target.value; save(); render(); return; }
    if(e.target.id==='f_est'){ t.est=e.target.value; save(); return; }
    if(e.target.id==='f_due'){ t.due=e.target.value||null; t.log.push(`срок: ${t.due||'снят'}`); ACTS.push(`${t.key}: срок ${t.due||'снят'}`); save(); render(); return; }
    const sub = e.target.closest('[data-sub]');
    if(sub){ t.subs[+sub.dataset.sub].done = e.target.checked; save(); openTask(t.key); return; }
  }
});

document.addEventListener('input', e=>{
  if(e.target.id==='q'){ S.q=e.target.value; if(S.view==='board'||S.view==='plan') render(); }
  if(e.target.dataset&&e.target.dataset.roi){ S.roiIn=S.roiIn||{}; S.roiIn[e.target.dataset.roi]=Math.max(0,parseInt(e.target.value||'0',10)||0); return; }
  if(e.target.dataset&&e.target.dataset.nsrole){ const a=e.target.dataset.nsrole.split(':'); const st=nsById(a[0]); const it=st&&(st.items||[]).find(x=>x.id===a[1]); if(it){ it.role=e.target.value; nsLog(it,'исполнитель → '+(NS_ROLE[it.role]||it.role)); nsTouch(it); save(); } return; }
  if(e.target.dataset&&e.target.dataset.nsdue){ const a=e.target.dataset.nsdue.split(':'); const st=nsById(a[0]); const it=st&&(st.items||[]).find(x=>x.id===a[1]); if(it){ it.due=e.target.value||''; nsLog(it,'срок → '+(it.due||'снят')); nsTouch(it); save(); render(); } return; }
  if(e.target.dataset&&e.target.dataset.nsdec){ const a=e.target.dataset.nsdec.split(':'); const st=nsById(a[0]); const it=st&&(st.items||[]).find(x=>x.id===a[1]); if(it){ it.dec=e.target.value; nsTouch(it); save(); } return; }
  if(e.target.dataset&&e.target.dataset.nsname){ const st=nsById(e.target.dataset.nsname); if(st){ st.name=e.target.value; save(); } return; }
  if(e.target.dataset&&e.target.dataset.nsproj){ const st=nsById(e.target.dataset.nsproj); if(st){ st.proj=e.target.value; save(); } return; }
  if(e.target.dataset&&e.target.dataset.nsasu){ const st=nsById(e.target.dataset.nsasu); if(st){ st.asu=e.target.value; save(); } return; }
  if(e.target.dataset&&e.target.dataset.nsorder){ const st=nsById(e.target.dataset.nsorder); if(st){ st.order=e.target.value; save(); } return; }
  if(e.target.dataset&&e.target.dataset.iccap){ icCap()[e.target.dataset.iccap]=Math.max(0,parseInt(e.target.value||'0',10)||0); return; }
  if(e.target.id==='kbq'){ S.kbq=e.target.value;
    // на вкладке «Поиск» текст ТЗ печатается/вставляется без ре-рендера (сохраняем фокус),
    // результаты — по кнопке; в каталоге/файлах — живой фильтр
    if((S.kbTab||'search')!=='search'){ render(); const i=$('kbq'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } } }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if($('roleExplorer').classList.contains('open')) closeRoleExplorer(); else if($('welcome').classList.contains('open')) closeWelcome(); else if($('dwgViewer').classList.contains('open')) closeDwg(); else { closeDrawer(); $('createOverlay').classList.remove('open'); } return; }
  // Зум вьюера чертежей с клавиатуры (когда открыт и фокус не в поле ввода замечания)
  if($('dwgViewer').classList.contains('open') && !/^(input|textarea|select)$/i.test((e.target.tagName||''))){
    if(e.key==='+'||e.key==='='){ e.preventDefault(); dwgZoom(1.25); }
    else if(e.key==='-'||e.key==='_'){ e.preventDefault(); dwgZoom(0.8); }
    else if(e.key==='0'){ e.preventDefault(); DWG.s=1; DWG.tx=0; DWG.ty=0; applyDwgTransform(); }
  }
});

/* drag & drop (доска задач И воронка сделок) */
document.addEventListener('dragstart', e=>{
  const c = e.target.closest('.tcard'); if(!c) return;
  // карточка задачи несёт data-task, карточка сделки — data-deal
  e.dataTransfer.setData('text/plain', (c.dataset.task? 'T:'+c.dataset.task : c.dataset.deal? 'D:'+c.dataset.deal : ''));
  c.classList.add('dragging');
});
function clearDragover(){ document.querySelectorAll('.col.dragover').forEach(c=>c.classList.remove('dragover')); }
function popCard(sel){ try{ requestAnimationFrame(()=>{ const el=document.querySelector(sel); if(el) el.classList.add('moved'); }); }catch(x){} }
document.addEventListener('dragend', e=>{ const c=e.target.closest('.tcard'); if(c) c.classList.remove('dragging'); clearDragover(); });
document.addEventListener('dragover', e=>{ const col=e.target.closest('.col'); if(col){ e.preventDefault(); if(!col.classList.contains('dragover')){ clearDragover(); col.classList.add('dragover'); } } });
document.addEventListener('drop', e=>{
  const col = e.target.closest('.col'); if(!col){ clearDragover(); return; }
  e.preventDefault(); clearDragover();
  const raw = e.dataTransfer.getData('text/plain');
  if(raw.startsWith('D:') && col.dataset.dealcol){        // сделка → новая стадия воронки
    const d = dealById(raw.slice(2));
    if(d && d.stage!==col.dataset.dealcol){ moveDeal(d, col.dataset.dealcol); render(); popCard(`[data-deal="${raw.slice(2)}"]`); }
    return;
  }
  if(raw.startsWith('T:') && col.dataset.col){            // задача → новый статус доски
    const t = task(raw.slice(2));
    if(t && t.col!==col.dataset.col){ moveTask(t,col.dataset.col,'перетащил '+PEOPLE[S.currentUser].full); render(); popCard(`[data-task="${raw.slice(2)}"]`); return; }
    render();
  }
});

/* CFD hover: крестик + тултип со счётчиками по статусам (делегировано) */
document.addEventListener('pointermove', e=>{
  const hit = e.target.closest('#cfdHit'); const tip=$('cfdTip'), cross=$('cfdCross'), svg=$('cfdChart');
  if(!hit || !CFD_DATA || !tip){ if(tip){tip.style.opacity=0;} if(cross)cross.style.opacity=0; return; }
  const r=svg.getBoundingClientRect(); const PL=34, PR=14, iw=720-PL-PR;
  const fx=(e.clientX-r.left)/r.width*720; // в координатах viewBox
  let i=Math.round((fx-PL)/iw*(CFD_DATA.length-1)); i=Math.max(0,Math.min(CFD_DATA.length-1,i));
  const xpx=PL+iw*i/(CFD_DATA.length-1);
  cross.setAttribute('x1',xpx); cross.setAttribute('x2',xpx); cross.style.opacity=.4;
  const d=CFD_DATA[i]; const day=i===13?'сегодня':('−'+(13-i)+' дн');
  tip.innerHTML=`<div style="font-family:var(--mono);font-size:10px;color:#9fb0c0;margin-bottom:4px">${day}</div>`+
    FLOW_STATES.slice().reverse().map(([k,l,c])=>`<div class="tr"><span><i style="background:${c};display:inline-block"></i> ${l}</span><b>${d[k]}</b></div>`).join('');
  const box=hit.closest('.chart-box').getBoundingClientRect();
  tip.style.left=Math.min(box.width-140,(xpx/720*box.width)+10)+'px'; tip.style.top='8px'; tip.style.opacity=1;
});
document.addEventListener('pointerleave', ()=>{ const t=$('cfdTip'); if(t)t.style.opacity=0; }, true);

/* вьюер чертежей: колесо-зум + панорама (делегировано — #dwgStage пересоздаётся) */
document.addEventListener('wheel', e=>{
  if(e.target.closest('#dwgStage') && DWG.code){ e.preventDefault(); dwgZoom(e.deltaY<0?1.12:0.9, e.clientX, e.clientY); }
}, {passive:false});
let dwgPan=null;
document.addEventListener('pointerdown', e=>{
  const s=e.target.closest('#dwgStage');
  if(s && DWG.code && DWG.mode!=='annotate' && !e.target.closest('[data-pin]')){
    dwgPan={x:e.clientX,y:e.clientY,tx:DWG.tx,ty:DWG.ty,id:e.pointerId};
    try{ s.setPointerCapture(e.pointerId); }catch(x){}   // не «залипает» при выходе за окно (ревью v1.1)
  }
});
document.addEventListener('pointermove', e=>{
  if(dwgPan && (e.buttons & 1)){ DWG.tx=dwgPan.tx+(e.clientX-dwgPan.x); DWG.ty=dwgPan.ty+(e.clientY-dwgPan.y); applyDwgTransform(); }
  else if(dwgPan && !(e.buttons & 1)){ dwgPan=null; }
});
document.addEventListener('pointerup', ()=>{ dwgPan=null; });
document.addEventListener('pointercancel', ()=>{ dwgPan=null; });

/* create */
function openCreate(epicId){
  $('nt_epic').innerHTML = S.epics.map(x=>`<option value="${x.id}" ${epicId===x.id?'selected':''}>${x.name}</option>`).join('');
  $('nt_who').innerHTML = Object.keys(PEOPLE).map(p=>`<option value="${p}" ${p===S.currentUser?'selected':''}>${PEOPLE[p].full} · ${PEOPLE[p].role}</option>`).join('');
  $('nt_title').value=''; $('nt_est').value=''; $('nt_desc').value=''; $('nt_due').value='';
  $('nt_prio').value='md'; $('nt_col').value='open';
  $('createOverlay').classList.add('open'); $('nt_title').focus();
}
function createTask(){
  const ttl = $('nt_title').value.trim(); if(!ttl) return;
  S.seq++;
  S.tasks.unshift({key:'СТ-'+S.seq, ttl, epic:$('nt_epic').value, who:$('nt_who').value, col:$('nt_col').value,
    prio:$('nt_prio').value, est:$('nt_est').value||null, sla:null, due:$('nt_due').value||null,
    desc:$('nt_desc').value.trim(), subs:[], comments:[], links:[], watchers:[],
    log:[`создана ${PEOPLE[S.currentUser].full} · назначена: ${PEOPLE[$('nt_who').value].full}`]});
  ACTS.push(`создана задача СТ-${S.seq}: ${ttl.slice(0,60)}`);
  $('createOverlay').classList.remove('open'); render(); toast('Задача создана: СТ-'+S.seq,'ok');
}

applyTheme(localStorage.getItem(THEME_KEY));
buildNav();
render();
bootstrapSrv();
try{ if(!localStorage.getItem(WELCOME_KEY)) openWelcome(); }catch(e){}  // приветствие при первом входе
setInterval(()=>{ let ch=runAutomations('timer'); if(nsScanOverdue()) ch=true; if(ch) renderBg(); }, 60000);  // v0.9: авто-проверка просрочек задач + проработки изделий (renderBg — не рвём ввод, ревью v1.0)
</script>
