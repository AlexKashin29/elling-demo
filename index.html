<title>Эллинг v2.2.4 «Готовность к трансляции · серверная авторизация, судовые изделия, правовой пакет» — рабочий MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Палитра «грунт и сталь» · акцент — сурик (красно-рыжий грунт корпуса на стапеле); циан-сталь — только для данных */
  :root{
    --bg:#F4F4F6; --panel:#FFFFFF; --panel2:#F4F5F7; --side:#0E1620; --side-ink:#93A7BC; --side-act:#37AECF;
    --ink:#111A24; --ink2:#48586A; --muted:#63727E;
    --line:#E3E7EC; --line2:#ECEFF3; --sh:0 1px 2px rgba(16,24,40,.05),0 4px 14px -3px rgba(16,24,40,.09);--sh-lg:0 14px 34px -10px rgba(16,24,40,.18),0 5px 12px -6px rgba(16,24,40,.12);
    --accent:#0C6B8F; --accent-soft:#DCEBF1; --steel:#0E7C93;
    --navy:#1F3A50; --navy-soft:#E4EBF3;
    --good:#1E7D46; --good-soft:#E1F1E7; --warn:#A9660A; --warn-soft:#F8EEDA; --risk:#C0362E; --risk-soft:#F9E4E1;
    --goz:#8a6d1f; --goz-base:#c8a63e;   /* ГОЗ-золото (военпред) — токенизировано, тёмная тема осветляет */
    
    --glow:0 0 0 1px rgba(12,107,143,.18), 0 8px 30px -8px rgba(30,50,70,.18);
    --shadow:0 10px 34px -14px rgba(20,35,55,.28);
    --aura:none;
    --mono:"Cascadia Mono",Consolas,"Roboto Mono",ui-monospace,monospace;
    --sans:"Onest","Segoe UI",-apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#080C12;--panel:#111A24;--panel2:#17222F;--side:#060A0F;--side-ink:#8195A9;
      --ink:#EAF1F8;--ink2:#A7B7C7;--muted:#7C8EA0;--line:#26343F;--line2:#1E2A36;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px -4px rgba(0,0,0,.55);--sh-lg:0 18px 42px -10px rgba(0,0,0,.75),0 6px 14px -6px rgba(0,0,0,.5);
      --accent:#37AECF;--accent-soft:#0D2A36;--steel:#3AAFC9;--navy:#8FB4D1;--navy-soft:#16283A;
      --good:#5FD08B;--good-soft:#122A1B;--warn:#E0A03C;--warn-soft:#2E2410;--risk:#F0736A;--risk-soft:#331714;
      --goz:#E3BE55;--goz-base:#E3BE55;
      
      --glow:0 0 0 1px rgba(55,174,207,.20), 0 10px 40px -10px rgba(0,0,0,.6);
      --shadow:0 16px 50px -18px rgba(0,0,0,.7);
      --aura:radial-gradient(1150px 680px at 80% -10%, rgba(55,174,207,.09), transparent 58%), radial-gradient(950px 640px at 8% 112%, rgba(46,110,142,.06), transparent 55%);}
  }
  :root[data-theme="light"]{--bg:#F4F4F6;--panel:#FFFFFF;--panel2:#F4F5F7;--side:#0E1620;--side-ink:#93A7BC;
    --ink:#111A24;--ink2:#48586A;--muted:#63727E;--line:#E3E7EC;--line2:#ECEFF3;--sh:0 1px 2px rgba(16,24,40,.05),0 4px 14px -3px rgba(16,24,40,.09);--sh-lg:0 14px 34px -10px rgba(16,24,40,.18),0 5px 12px -6px rgba(16,24,40,.12);--accent:#0C6B8F;
    --accent-soft:#DCEBF1;--steel:#0E7C93;--navy:#1F3A50;--navy-soft:#E4EBF3;--good:#1E7D46;--good-soft:#E1F1E7;
    --warn:#A9660A;--warn-soft:#F8EEDA;--risk:#C0362E;--risk-soft:#F9E4E1;
    
    --glow:0 0 0 1px rgba(12,107,143,.18), 0 8px 30px -8px rgba(30,50,70,.18);
    --shadow:0 10px 34px -14px rgba(20,35,55,.28);--aura:none;}
  :root[data-theme="dark"]{--bg:#080C12;--panel:#111A24;--panel2:#17222F;--side:#060A0F;--side-ink:#8195A9;
    --ink:#EAF1F8;--ink2:#A7B7C7;--muted:#7C8EA0;--line:#26343F;--line2:#1E2A36;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px -4px rgba(0,0,0,.55);--sh-lg:0 18px 42px -10px rgba(0,0,0,.75),0 6px 14px -6px rgba(0,0,0,.5);--accent:#37AECF;
    --accent-soft:#0D2A36;--steel:#3AAFC9;--navy:#8FB4D1;--navy-soft:#16283A;--good:#5FD08B;--good-soft:#122A1B;
    --warn:#E0A03C;--warn-soft:#2E2410;--risk:#F0736A;--risk-soft:#331714;--goz:#E3BE55;--goz-base:#E3BE55;
    
    --glow:0 0 0 1px rgba(55,174,207,.20), 0 10px 40px -10px rgba(0,0,0,.6);
    --shadow:0 16px 50px -18px rgba(0,0,0,.7);
    --aura:radial-gradient(1150px 680px at 80% -10%, rgba(55,174,207,.09), transparent 58%), radial-gradient(950px 640px at 8% 112%, rgba(46,110,142,.06), transparent 55%);}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;display:flex;min-height:100vh;
    -webkit-font-smoothing:antialiased;letter-spacing:0;position:relative}
  body::before{content:"";position:fixed;inset:0;z-index:0;background:var(--aura);pointer-events:none;transition:opacity .4s ease}
  body>*{position:relative;z-index:1}
  /* плавное круговое раскрытие темы (View Transitions API) */
  ::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
  ::view-transition-new(root){z-index:1}
  ::view-transition-old(root){z-index:0}
  button{font-family:var(--sans)}
  ::selection{background:var(--accent);color:#fff}
  button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .search:focus,.userbox select:focus,.fields input:focus,.fields select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  /* ===== sidebar ===== */
  aside{width:216px;flex:none;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;
    padding:16px 12px;gap:2px;position:sticky;top:0;height:100vh;border-right:1px solid rgba(255,255,255,.05)}
  aside .logo{display:flex;align-items:center;gap:11px;font-weight:750;color:#fff;font-size:17px;padding:6px 8px 18px;letter-spacing:-.02em;
    text-decoration:none;border-radius:10px;transition:opacity .15s}
  aside a.logo:hover{opacity:.82}
  aside a.logo:hover .dot{box-shadow:0 0 0 3px color-mix(in srgb,var(--side-act) 35%,transparent)}
  aside .logo .dot{width:26px;height:26px;border-radius:8px;background:var(--accent);flex:none;position:relative}
  aside .logo .dot::after{content:"";position:absolute;inset:0;border-radius:8px;background:linear-gradient(180deg,transparent 52%,var(--side) 52%,var(--side) 68%,transparent 68%)}
  aside .logo small{font-family:var(--mono);font-size:8.5px;color:var(--side-ink);font-weight:400;margin-left:auto;letter-spacing:0;opacity:.7}
  aside nav button{display:flex;align-items:center;gap:11px;background:none;border:none;color:var(--side-ink);
    font-size:14px;font-weight:600;padding:11px 13px;border-radius:10px;cursor:pointer;text-align:left;width:100%;
    position:relative;transition:background .15s,color .15s;letter-spacing:-.01em}
  aside nav button:hover{background:rgba(255,255,255,.06);color:#fff}
  aside nav button[aria-current="true"]{background:color-mix(in srgb,var(--accent) 22%,transparent);color:#fff;font-weight:650}
  aside nav button[aria-current="true"]::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
  svg.ic{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
  aside nav button svg.ic{opacity:.85}
  aside nav button[aria-current="true"] svg.ic{opacity:1}
  aside nav button .n{margin-left:auto;font-size:10.5px;background:#E5484D;color:#fff;border-radius:99px;padding:1px 7px;font-weight:700;min-width:18px;text-align:center;box-shadow:0 1px 3px rgba(229,72,77,.5)}
  /* ---- v1.40: сгруппированное меню под роли ---- */
  /* Логотип сверху и кнопка/футер снизу закреплены; скроллится ТОЛЬКО навигация.
     Раньше при раскрытии всех групп контент переполнял aside и «выдавливал»
     кнопку и футер за экран — меню скакало. min-height:0 разрешает flex-ребёнку
     сжиматься ниже своего контента и включает внутренний скролл. */
  aside>.logo,aside>.create,aside>.bottom{flex:none}
  aside nav{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-height:0;overflow-y:auto;
    scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent}
  aside nav::-webkit-scrollbar{width:8px}
  aside nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:8px}
  aside nav::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.28)}
  .navhead .gl{flex:1}
  .navhead{color:var(--side-ink)}
  .navhead .chev{margin-left:auto;width:13px;height:13px;opacity:.55;transition:transform .26s cubic-bezier(.16,1,.3,1)}
  .navgroup.open>.navhead .chev{transform:rotate(180deg);opacity:.9}
  .navbody{display:flex;flex-direction:column;gap:2px;overflow:hidden;max-height:0;opacity:0;
    transition:max-height .3s cubic-bezier(.16,1,.3,1),opacity .2s ease,margin .2s}
  .navgroup.open>.navbody{max-height:300px;opacity:1;margin:2px 0 4px}
  .navbody button{padding-left:36px;font-size:13.5px;font-weight:550}
  .navbody button svg.ic{width:15px;height:15px;opacity:.65}
  .navbody button[aria-current="true"] svg.ic{opacity:1}
  .navgroup.has-active:not(.open)>.navhead .gl::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--accent);margin-left:8px;vertical-align:middle;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
  /* ---- v1.40: ролевой хаб быстрых действий на «Сегодня» ---- */
  .hub{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0 22px}
  .hub-tile{display:flex;align-items:center;gap:12px;text-align:left;padding:16px 15px;border-radius:14px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:var(--sh);font:inherit;font-weight:650;font-size:14px;
    position:relative;transition:transform .16s cubic-bezier(.16,1,.3,1),box-shadow .16s,border-color .16s}
  .hub-tile:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--sh-lg)}
  .hub-tile:active{transform:translateY(-1px)}
  .hub-tile svg.ic{width:22px;height:22px;color:var(--accent);flex:none;stroke-width:1.7}
  .hub-tile .ht-l{flex:1;line-height:1.25}
  .hub-tile .ht-c{background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:1px 9px;font-size:12px;font-weight:800;flex:none}
  .hub-tile svg.ic.ht-go{width:15px;height:15px;color:var(--muted);transform:rotate(-90deg);opacity:.55}
  .hub-tile:hover svg.ic.ht-go{color:var(--accent);opacity:1}
  @media(max-width:900px){.hub{grid-template-columns:1fr 1fr}}
  @media(max-width:520px){.hub{grid-template-columns:1fr}}
  /* ---- v1.41: бенчмарки флота + силуэт судна ---- */
  .hello-ship{position:relative;overflow:hidden}
  .hello-ship-art{position:absolute;right:8px;bottom:-8px;width:210px;height:80px;stroke:var(--accent);fill:none;stroke-width:1.6;opacity:.15;pointer-events:none;stroke-linecap:round;stroke-linejoin:round}
  @media(max-width:680px){.hello-ship-art{display:none}}
  .ai-strip{display:flex;gap:13px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--sh);margin:2px 0 16px;font-size:13.5px;color:var(--ink2);line-height:1.5}
  .ai-strip b{color:var(--ink)}
  .ai-strip svg.ic{width:22px;height:22px;color:var(--accent);flex:none;margin-top:1px}
  .bm-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .bm-filters .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .bm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(335px,1fr));gap:14px}
  .bm-card{border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--sh);padding:16px 17px;display:flex;flex-direction:column;gap:11px;transition:transform .16s cubic-bezier(.16,1,.3,1),box-shadow .16s,border-color .16s}
  .bm-card:hover{transform:translateY(-3px);box-shadow:var(--sh-lg);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
  .bm-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .bm-name{font-weight:750;font-size:15.5px;letter-spacing:-.01em}
  .bm-cls{font-size:12.5px;color:var(--muted);margin-top:2px}
  .bm-series{flex:none;font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:3px 10px;white-space:nowrap}
  .bm-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:2px 0}
  .bm-metrics>div{background:var(--panel2);border-radius:10px;padding:8px 10px;text-align:center}
  .bm-metrics b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em}
  .bm-metrics span{font-size:10.5px;color:var(--muted)}
  .bm-sko{display:flex;flex-wrap:wrap;gap:6px}
  .bm-ins{font-size:12.8px;color:var(--ink2);line-height:1.45}
  .bm-tag{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:1px 7px;border-radius:6px;margin-right:6px;vertical-align:middle}
  .bm-tag.good{color:var(--good);background:var(--good-soft)}
  .bm-tag.acc{color:var(--accent);background:var(--accent-soft)}
  .bm-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:2px;padding-top:10px;border-top:1px solid var(--line2)}
  .bm-src{font-size:11px;color:var(--muted)}
  .bm-foot .btn.ghost{padding:5px 12px;font-size:12px}
  .bm-sko .stchip{font-size:11.5px}
  .stchip.sko-ok{color:var(--good)}
  .stchip.sko-gap{color:var(--accent);border:1px dashed color-mix(in srgb,var(--accent) 55%,transparent);background:transparent}
  .bm-gap{font-size:12.3px;color:var(--ink2);background:var(--panel2);border-radius:9px;padding:7px 11px}
  .bm-gap b{color:var(--good)}
  .gap-op{color:var(--accent);font-weight:600}
  .bm-legend{display:flex;gap:16px;font-size:11.5px;color:var(--muted);margin:-4px 0 14px;flex-wrap:wrap}
  .bm-legend span{display:inline-flex;align-items:center;gap:6px}
  .bm-legend i{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
  .bm-btns{display:flex;gap:6px}
  .psec{margin:22px 0 10px;font-size:15px;color:var(--ink);font-weight:700;letter-spacing:-.01em}
  .psec:first-child{margin-top:4px}
  /* v1.49: прототип Т1 — кросс-орг взаимодействие в портале */
  .xorg{display:flex;align-items:stretch;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh);flex-wrap:wrap}
  .xorg-side{display:flex;align-items:center;gap:11px;flex:1;min-width:180px}
  .xorg-side b{font-size:13.5px;display:block;letter-spacing:-.01em}
  .xorg-side small{font-size:11px;color:var(--muted)}
  .xdot{width:13px;height:13px;border-radius:50%;flex:none}
  .xdot.cloud{background:var(--steel);box-shadow:0 0 0 4px color-mix(in srgb,var(--steel) 26%,transparent)}
  .xdot.box{background:var(--navy);box-shadow:0 0 0 4px color-mix(in srgb,var(--navy) 22%,transparent)}
  .xorg-link{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex:none;padding:0 4px}
  .xarrow{font-size:18px;color:var(--muted);line-height:1}
  .xsync{font-family:var(--mono);font-size:10px;color:var(--good);white-space:nowrap}
  .xorg-note{font-size:12.3px;color:var(--ink2);line-height:1.5;margin-bottom:16px}
  .xorg-note b{color:var(--ink)}
  .xown-leg{display:flex;gap:16px;font-size:11px;color:var(--muted);margin:-2px 0 8px;flex-wrap:wrap}
  .xown-leg span{display:inline-flex;align-items:center;gap:5px}
  .xown-leg i{width:9px;height:9px;border-radius:3px;display:inline-block}
  .xown-leg i.sup{background:var(--accent)}.xown-leg i.yard{background:var(--good)}
  .xown{font-size:9.5px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap;flex:none}
  /* Горизонтальный трекер вех заказа для внешнего заказчика («где мой заказ» с одного взгляда) */
  .ptl-wrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px 14px;box-shadow:var(--sh);margin-bottom:12px;overflow-x:auto}
  .ptl-track{display:flex;align-items:flex-start;min-width:min-content}
  .ptl-node{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:96px;flex:none}
  .ptl-dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;font-family:var(--mono);border:2px solid;background:var(--panel);z-index:1}
  .ptl-node.done .ptl-dot{border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 15%,var(--panel))}
  .ptl-node.cur .ptl-dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
  .ptl-node.next .ptl-dot{border-color:var(--line);color:var(--muted)}
  .ptl-lbl{font-size:11px;text-align:center;line-height:1.25;max-width:100px;color:var(--ink2);font-weight:600}
  .ptl-node.next .ptl-lbl{color:var(--muted);font-weight:500}
  .ptl-own{font-size:8.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--steel);background:var(--panel2);border-radius:5px;padding:1px 6px}
  .ptl-own.yard{color:var(--accent);background:var(--accent-soft)}
  .ptl-link{flex:1 0 22px;height:2px;margin-top:14px;min-width:22px;background:var(--line)}
  .ptl-link.done{background:var(--good)}
  .xown.sup{background:var(--accent-soft);color:var(--accent)}
  .xown.yard{background:var(--good-soft);color:var(--good)}
  .xtag{display:inline-block;font-size:9.5px;font-weight:700;border-radius:5px;padding:1px 7px;vertical-align:middle}
  .xtag.ext{background:var(--good-soft);color:var(--good)}
  .xtag.int{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .xtoggle{display:inline-flex;align-items:center;gap:7px;margin-top:8px;font-size:11.5px;color:var(--ink2);cursor:pointer;user-select:none}
  .xtoggle input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
  .xfeed-note{font-size:11.5px;color:var(--muted);margin:2px 0 10px;line-height:1.5}
  .elx-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .elx-mode{font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
  .elx-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line2);flex-wrap:wrap;font-size:12.3px}
  .elx-dir{font-weight:700;font-size:10.5px;border-radius:6px;padding:2px 8px;white-space:nowrap;flex:none}
  .elx-dir.out{background:var(--accent-soft);color:var(--accent)}
  .elx-dir.in{background:var(--good-soft);color:var(--good)}
  .elx-id{font-family:var(--mono);font-size:11px;color:var(--ink);font-weight:600}
  .elx-note{color:var(--ink2);flex:1;min-width:120px}
  .elx-sig{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
  .panel.wiz{border:1.5px solid color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 8%,transparent),var(--sh)}
  .wiz-steps{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 14px}
  .wiz-step{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:6px 14px 6px 6px}

  /* v1.57: комфортная длина строки текста на широких экранах (карточки остаются во всю ширину) */
  .panel>p,.xorg-note,.hello small{max-width:82ch}
  /* живой переход между экранами + мягкое появление карточек */
  @keyframes viewIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  @keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .view-in{animation:viewIn .34s cubic-bezier(.16,1,.3,1)}
  .view-in .stats .stat{animation:cardIn .42s cubic-bezier(.16,1,.3,1) backwards}
  .view-in .stats .stat:nth-child(1){animation-delay:.03s}
  .view-in .stats .stat:nth-child(2){animation-delay:.07s}
  .view-in .stats .stat:nth-child(3){animation-delay:.11s}
  .view-in .stats .stat:nth-child(4){animation-delay:.15s}
  .view-in .stats .stat:nth-child(5){animation-delay:.19s}
  .view-in .stats .stat:nth-child(n+6){animation-delay:.22s}
  /* плитки хаба «Сегодня» появлялись плоско — вводим тем же ритмом, что и статы дашборда */
  .view-in .hub .hub-tile{animation:cardIn .42s cubic-bezier(.16,1,.3,1) backwards}
  .view-in .hub .hub-tile:nth-child(1){animation-delay:.04s}.view-in .hub .hub-tile:nth-child(2){animation-delay:.08s}
  .view-in .hub .hub-tile:nth-child(3){animation-delay:.12s}.view-in .hub .hub-tile:nth-child(4){animation-delay:.16s}
  .view-in .hub .hub-tile:nth-child(n+5){animation-delay:.19s}
  .view-in .panel,.view-in .anacard,.view-in .wcard{animation:cardIn .46s cubic-bezier(.16,1,.3,1) backwards;animation-delay:.06s}
  /* v2.0.2: тот же живой вход распространён на карточные виды, что раньше «щёлкали» плоско
     (интеграции, команда, бенчмарки, выбор контура) — единый ритм появления по всему продукту */
  .view-in .onec-card,.view-in .tm-card,.view-in .bm-card,.view-in .cont-opt{animation:cardIn .44s cubic-bezier(.16,1,.3,1) backwards;animation-delay:.08s}
  .view-in .onec-card:nth-child(2),.view-in .tm-card:nth-child(2),.view-in .bm-card:nth-child(2){animation-delay:.13s}
  .view-in .onec-card:nth-child(3),.view-in .tm-card:nth-child(3),.view-in .bm-card:nth-child(3){animation-delay:.18s}
  .view-in .onec-card:nth-child(n+4),.view-in .tm-card:nth-child(n+4),.view-in .bm-card:nth-child(n+4){animation-delay:.22s}
  @media (prefers-reduced-motion:reduce){.view-in,.view-in *{animation:none!important}}
  @media(max-width:720px){.content{padding:18px 16px 56px}}

  .av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none;vertical-align:middle;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 1px 2px rgba(16,24,40,.14)}

  .re-panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:1000px;width:100%;max-height:90vh;overflow-y:auto;padding:26px 28px;box-shadow:var(--sh-lg);position:relative}
  .re-panel::before{content:"";position:absolute;left:0;top:0;right:0;height:2px;border-radius:16px 16px 0 0;background:linear-gradient(90deg,var(--accent),var(--steel) 55%,transparent)}
  .re-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:6px}

  .re-top .re-x{margin-left:auto;background:transparent;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:2px 8px;border-radius:8px}
  .re-top .re-x:hover{background:var(--panel2);color:var(--ink)}
  .re-sub{font-size:13.5px;color:var(--ink2);margin:0 0 18px;max-width:76ch}
  .re-sub b{color:var(--ink)}
  .re-tier{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:20px 0 10px;font-weight:700}
  .re-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .re-card{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:14px 15px;display:flex;flex-direction:column;gap:9px;transition:border-color .15s,transform .15s,box-shadow .15s}
  .re-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--sh)}
  .re-h{display:flex;align-items:center;gap:10px}
  .re-ava{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;font-family:var(--mono);flex:none}
  .re-h b{font-size:14px;line-height:1.2}
  .re-role{font-size:11.5px;color:var(--ink2);margin-top:2px}
  .re-badge{margin-left:auto;font-family:var(--mono);font-size:9px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:20px;padding:2px 9px;align-self:flex-start}
  .re-scope{font-size:11.5px;color:var(--muted);line-height:1.4;min-height:16px}
  .re-fin{font-size:11px;font-weight:600;border-radius:7px;padding:4px 9px;display:inline-block;align-self:flex-start}
  .re-fin.yes{color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent)}
  .re-fin.no{color:var(--muted);background:var(--panel);border:1px solid var(--line)}
  .re-views{display:flex;flex-wrap:wrap;gap:4px}
  .re-chip{font-size:10px;color:var(--ink2);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
  .re-card .btn{margin-top:2px;width:100%}
  .re-now{font-family:var(--mono);font-size:11px;color:var(--good);border:1px solid color-mix(in srgb,var(--good) 40%,transparent);background:color-mix(in srgb,var(--good) 10%,transparent);border-radius:7px;padding:3px 9px;text-align:center}
  .re-demo{border:1px solid color-mix(in srgb,var(--accent) 24%,transparent);background:color-mix(in srgb,var(--accent) 6%,transparent);border-radius:12px;padding:13px 15px;margin-bottom:6px}
  .re-demo-h{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono);margin-bottom:11px}
  .re-reset{margin-left:auto;font-family:var(--sans);font-size:11.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink2);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 11px;cursor:pointer;transition:border-color .15s,color .15s}
  .re-reset:hover{border-color:var(--accent);color:var(--accent)}
  .re-jumps{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
  .re-jump{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer;font:inherit;font-size:13px;font-weight:600;color:var(--ink);transition:border-color .15s,transform .15s,box-shadow .15s}
  .re-jump:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--sh)}
  /* v1.3 графики */
  .chart-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .ch-sub{font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:400;letter-spacing:.02em}
  .legend2{display:flex;gap:14px;flex-wrap:wrap}
  .legend2 .lg{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .legend2 .lg i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .chart-box{position:relative;width:100%}
  .chart-box svg{width:100%;height:auto;display:block;overflow:visible}
  .chart-tip{position:absolute;pointer-events:none;background:var(--side);color:#fff;border-radius:9px;padding:9px 12px;
    font-size:12px;line-height:1.6;box-shadow:var(--shadow);opacity:0;transition:opacity .1s;z-index:5;white-space:nowrap}
  .chart-tip .tr{display:flex;align-items:center;gap:7px;justify-content:space-between}
  .chart-tip .tr i{width:9px;height:9px;border-radius:2px}
  .chart-tip b{font-family:var(--mono)}
  .ch-note{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.6;max-width:60em}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;transition:box-shadow .18s}
  .stat:hover{box-shadow:var(--sh-lg)}
  .stat .v{font-size:25px;font-weight:770;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;
    color:var(--ink)}
  .stat .l{font-size:12px;color:var(--muted);margin-top:3px}
  .loadrow{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px;color:var(--ink2)}
  .loadrow .nm{width:170px;flex:none}
  .loadrow .bar{flex:1;height:9px;background:var(--line2);border-radius:99px;overflow:hidden}
  .loadrow .bar i{display:block;height:100%;background:var(--navy)}
  .loadrow .n{font-family:var(--mono);font-size:11px;color:var(--muted);width:30px;text-align:right}

  /* drawer */
  .drawer-bg{position:fixed;inset:0;background:rgba(10,16,22,.45);display:none;z-index:40}
  .drawer-bg.open{display:block}
  .drawer{position:fixed;top:0;right:-580px;width:min(580px,94vw);height:100vh;background:var(--panel);
    border-left:1px solid var(--line);z-index:50;transition:right .18s ease;overflow-y:auto;padding:20px 24px}
  .drawer.open{right:0}
  .drawer .key{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .drawer h2{font-size:18px;margin:4px 0 10px;font-weight:720;line-height:1.3}
  .primact{display:flex;gap:10px;align-items:center;margin:0 0 16px;flex-wrap:wrap}
  .primact .st{font-size:12.5px;color:var(--muted)}
  .fields{display:grid;grid-template-columns:110px 1fr;gap:9px 12px;align-items:center;margin-bottom:16px}
  .fields label{font-size:12px;font-weight:600;color:var(--ink2)}
  .fields select,.fields input{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 11px;color:var(--ink);font-size:13.5px;font-family:var(--sans);width:100%;transition:border-color .15s,box-shadow .15s}
  .fields select:hover,.fields input:hover{border-color:var(--muted)}
  .drawer h4{font-size:13.5px;color:var(--ink);margin:18px 0 8px;font-weight:700;letter-spacing:-.01em}
  .sub{display:flex;gap:9px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13.5px;color:var(--ink)}
  .sub input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
  .sub.done span{text-decoration:line-through;color:var(--muted)}
  .addline{display:flex;gap:8px;margin-top:8px}
  .addline input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 11px;color:var(--ink);font-size:13px;font-family:var(--sans)}
  .comment{background:var(--panel2);border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:13px;color:var(--ink2)}
  .comment .a{font-weight:700;color:var(--ink);font-size:12px}
  .logline{font-family:var(--mono);font-size:10.5px;color:var(--muted);padding:3px 0}
  .drawer .close{float:right;background:none;border:1px solid var(--line);border-radius:8px;color:var(--muted);cursor:pointer;font-size:12px;padding:5px 11px}
  .desc{font-size:13.5px;color:var(--ink2);margin-bottom:8px}
  .desc b{color:var(--ink)}

  /* состав изделия (BOM) */
  .bomtree{border:1px solid var(--line2);border-radius:10px;overflow:hidden;margin-top:6px}
  .bomrow{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line2);font-size:13px}
  .bomrow:last-child{border-bottom:none}
  .bomrow:nth-child(odd){background:color-mix(in srgb,var(--panel2) 55%,transparent)}
  .bomrow.hit{background:var(--warn-soft,rgba(224,160,60,.14));box-shadow:inset 3px 0 0 var(--warn)}
  .bomcode{font-family:var(--mono);font-size:11.5px;color:var(--accent);white-space:nowrap;flex:none}
  .bomname{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .bomqty{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;flex:none}
  .bomrev{font-family:var(--mono);font-size:10.5px;color:var(--good);background:var(--good-soft,rgba(95,208,139,.14));
    border:1px solid color-mix(in srgb,var(--good) 30%,transparent);border-radius:6px;padding:1px 6px;white-space:nowrap;flex:none}
  .bomrev.nodoc{color:var(--muted);background:transparent;border-color:var(--line)}
  /* ИИ-оценка по аналогам */
  .an-panel{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 16px;background:var(--panel2)}
  .an-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:12px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .an-est{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:10px 0 14px;border-bottom:1px solid var(--line2);margin-bottom:10px}
  .an-estapply{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 30%,transparent);border-radius:9px;padding:9px 13px;margin:0 0 12px}
  .an-est-v{font-size:30px;font-weight:780;letter-spacing:-.02em;color:var(--accent,#C24309);font-variant-numeric:tabular-nums;white-space:nowrap}
  .an-est-v span{font-size:14px;font-weight:600;color:var(--muted)}
  .an-est-l{font-size:12.5px;color:var(--ink2);flex:1;min-width:220px;line-height:1.4}
  .ic-prio{background:transparent;border:1px solid var(--line);border-radius:20px;color:var(--muted);font-size:10.5px;padding:2px 8px;cursor:pointer;white-space:nowrap}
  .ic-prio:hover{border-color:var(--bad);color:var(--bad)} .ic-prio.on{background:color-mix(in srgb,var(--bad) 12%,transparent);border-color:var(--bad);color:var(--bad)}
  .an-ic{font-size:12px;color:var(--ink2);margin:8px 0 4px;padding:8px 11px;border-radius:9px;background:color-mix(in srgb,var(--warn) 9%,transparent);border:1px solid color-mix(in srgb,var(--warn) 26%,transparent)}
  .an-ic b{color:var(--ink);font-variant-numeric:tabular-nums}
  .an-ic.over{background:color-mix(in srgb,var(--bad) 10%,transparent);border-color:color-mix(in srgb,var(--bad) 32%,transparent);color:var(--bad)}
  .an-demo{font-size:11.5px;color:var(--ink2);line-height:1.5;margin:0 0 10px;padding:8px 11px;border-radius:9px;background:color-mix(in srgb,var(--accent,#2E6E8E) 8%,transparent);border:1px solid color-mix(in srgb,var(--accent,#2E6E8E) 22%,transparent)}
  .anrows{display:flex;flex-direction:column;gap:7px}
  .anrow{display:grid;grid-template-columns:44px 90px 1fr auto;gap:10px;align-items:center;cursor:pointer;padding:3px 0}
  .anrow:hover .annm{color:var(--accent,#C24309)}
  .anpct{font-family:var(--mono);font-size:12.5px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .anbar{height:7px;border-radius:99px;background:var(--line2);overflow:hidden}
  .anbar i{display:block;height:100%;border-radius:99px}
  .annm{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .anh{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
  .anwhy{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;margin:1px 0 6px}
  .anwhy-c{font-size:9.5px;font-family:var(--mono);letter-spacing:.02em;padding:1px 7px;border-radius:20px;border:1px solid var(--line);white-space:nowrap}
  .anwhy-c.s{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent);background:color-mix(in srgb,var(--good) 9%,transparent)}
  .anwhy-c.p{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
  .anwhy-c.w{color:var(--muted)}
  .an-hint{font-size:11.5px;color:var(--ink2);background:color-mix(in srgb,var(--warn) 8%,transparent);border:1px solid color-mix(in srgb,var(--warn) 22%,transparent);border-radius:8px;padding:6px 10px;margin-top:6px}
  .an-hint b{color:var(--ink)}
  @media(max-width:640px){.anrow{grid-template-columns:40px 60px 1fr;grid-template-rows:auto auto}.anh{grid-column:1/-1;text-align:right}}
  /* ROI-калькулятор */
  .roi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
  .roi-f{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted)}
  .roi-f input{background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink);
    font-size:14px;padding:7px 10px;font-variant-numeric:tabular-nums}
  .roi-out{margin-top:14px;padding-top:14px;border-top:1px solid var(--line2)}
  .roi-total{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
  .roi-total-v{font-size:30px;font-weight:780;letter-spacing:-.02em;color:var(--good);font-variant-numeric:tabular-nums}
  .roi-total-l{font-size:12.5px;color:var(--ink2)}
  .roi-lines{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .roi-lines>div{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:11px 13px;display:flex;flex-direction:column;gap:2px}
  .roi-lines span{font-size:12px;color:var(--muted)}
  .roi-lines b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
  .roi-lines small{font-size:10.5px;color:var(--muted);line-height:1.35}
  .roi-ops{margin-top:12px;font-size:11.5px;color:var(--ink2);line-height:1.5;padding:9px 12px;border-radius:9px;background:color-mix(in srgb,var(--accent,#2E6E8E) 7%,transparent);border:1px solid color-mix(in srgb,var(--accent,#2E6E8E) 20%,transparent)}
  @media(max-width:640px){.roi-lines{grid-template-columns:1fr}}
  /* Проработка НС */
  .ns-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
  .ns-tabs{display:flex;gap:8px;flex-wrap:wrap;flex:1}
  .ns-tab{display:flex;flex-direction:column;gap:5px;min-width:170px;text-align:left;background:var(--panel);
    border:1px solid var(--line);border-radius:11px;padding:9px 11px;cursor:pointer;transition:border-color .15s}
  .ns-tab:hover{border-color:var(--line2)}
  .ns-tab.on{border-color:var(--accent,#2E6E8E);box-shadow:inset 0 0 0 1px var(--accent,#2E6E8E)}
  .ns-tab-n{font-size:12.5px;font-weight:640;color:var(--ink);line-height:1.25}
  .ns-tab-m{display:block;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
  .ns-tab-m i{display:block;height:100%;background:var(--good);border-radius:3px}
  .ns-tab-s{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .ns-over{color:var(--bad)}
  .ns-title-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .ns-name{flex:1;min-width:180px;background:transparent;border:1px solid transparent;border-radius:8px;
    color:var(--ink);font-size:16px;font-weight:720;padding:5px 7px;letter-spacing:-.01em}
  .ns-name:hover{border-color:var(--line)} .ns-name:focus{border-color:var(--line2);outline:none;background:var(--panel)}
  .ns-prog{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .ns-del{background:transparent;border:none;cursor:pointer;font-size:14px;opacity:.6}.ns-del:hover{opacity:1}
  .ns-progbar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:10px}
  .ns-progbar i{display:block;height:100%;background:var(--good);border-radius:4px;transition:width .2s}
  .ns-eng{font-size:11.5px;color:var(--muted);margin-bottom:4px}
  .ns-meta{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px}
  .ns-meta label{display:flex;flex-direction:column;gap:4px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .ns-note{font-size:12px;color:var(--ink2);background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:8px 11px;margin-bottom:12px}
  .ns-grid-h,.ns-row{display:grid;grid-template-columns:104px 1.4fr 130px 140px 2fr 26px;gap:9px;align-items:center}
  .ns-grid-h{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:0 2px 6px;border-bottom:1px solid var(--line2)}
  .ns-row{padding:7px 2px;border-bottom:1px solid var(--line)}
  .ns-row-over{background:linear-gradient(90deg,var(--bad)0%,transparent 2px)}
  .ns-st{border:1px solid;border-radius:20px;padding:4px 0;font-size:11px;font-weight:640;cursor:pointer;text-align:center}
  .ns-title{font-size:13px;color:var(--ink);line-height:1.3}
  .ns-dep{display:inline-block;margin-left:7px;font-size:10px;font-weight:600;padding:1px 7px;border-radius:20px;vertical-align:middle;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
  .ns-dep.ready{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent);border:1px solid color-mix(in srgb,var(--good) 40%,transparent)}
  .ns-dep.blocked{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 38%,transparent)}
  .ns-dep.conflict{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
  .ns-due-conflict{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
  .ns-conflict-bar{font-size:12px;color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent);border-radius:9px;padding:8px 11px;margin-bottom:12px}
  .ns-crit{font-size:12px;color:var(--ink2);background:color-mix(in srgb,var(--accent,#2E6E8E) 8%,transparent);border:1px solid color-mix(in srgb,var(--accent,#2E6E8E) 26%,transparent);border-radius:9px;padding:8px 11px;margin-bottom:12px;line-height:1.4}
  .ns-crit b{color:var(--accent,#2E6E8E)}
  .ns-crit-star{color:var(--accent,#2E6E8E);font-size:12px}
  /* Визуальный критический путь: цепочка узлов по статусам — «что определяет срок готовности» */
  .cp-wrap{border:1px solid color-mix(in srgb,var(--accent) 24%,transparent);background:color-mix(in srgb,var(--accent) 6%,transparent);border-radius:11px;padding:11px 13px 13px;margin-bottom:12px}
  .cp-head{font-size:11px;color:var(--ink2);margin-bottom:11px;display:flex;align-items:center;gap:7px}
  .cp-head b{color:var(--accent);font-weight:700}
  .cp-head .cp-fin{margin-left:auto;font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:20px;white-space:nowrap}
  .cp-track{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding-bottom:3px;scrollbar-width:thin}
  .cp-node{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:74px;flex:none;position:relative;cursor:pointer;background:none;border:none;padding:0;font:inherit}

<script>
/* ================= data ================= */
const LSKEY = 'stapel_v03';
const PEOPLE = {
  orlov:{n:'Ор',full:'Орлов',role:'директор',c:'#6E5E2E',lvl:0,mgr:null,dept:'дирекция'},
  volkov:{n:'Вл',full:'Волков',role:'зам. директора',c:'#4A5A6E',lvl:1,mgr:'orlov',dept:'дирекция'},
  maksimov:{n:'Мк',full:'Максимов',role:'рук. ИЦ',c:'#1F3A50',lvl:2,mgr:'volkov',dept:'инженерный центр'},
  belov:{n:'Бл',full:'Белов',role:'рук. продаж',c:'#C2691F',lvl:2,mgr:'volkov',dept:'продажи'},
  kuzmin:{n:'Км',full:'Кузьмин',role:'рук. закупок',c:'#7A2E4E',lvl:2,mgr:'volkov',dept:'закупки'},
  gromov:{n:'Гр',full:'Громов',role:'рук. логистики',c:'#2E6E5E',lvl:2,mgr:'volkov',dept:'логистика'},
  petrov:{n:'Пт',full:'Петров',role:'инженер',c:'#2E6E8E',lvl:3,mgr:'maksimov',dept:'инженерный центр'},
  ivanov:{n:'Ив',full:'Иванов',role:'инженер',c:'#5B7A2E',lvl:3,mgr:'maksimov',dept:'инженерный центр'},
  smirnov:{n:'См',full:'Смирнов',role:'инженер',c:'#7A4E8E',lvl:3,mgr:'maksimov',dept:'инженерный центр'},
  sokolova:{n:'Ск',full:'Соколова',role:'продажи',c:'#B3541E',lvl:3,mgr:'belov',dept:'продажи'},
  kuznetsova:{n:'Кз',full:'Кузнецова',role:'закупки',c:'#8E2E4E',lvl:3,mgr:'kuzmin',dept:'закупки'},
  loginov:{n:'Лг',full:'Логинов',role:'логист',c:'#3E6E5E',lvl:3,mgr:'gromov',dept:'логистика'},
};
/* ---- v1.60: ролевая иерархия — доступы/scope по уровням, «вижу подчинённых» ---- */
const ROLE_META = {
  'директор':      {scope:'вся компания · настройка ролей и доступов', tier:'Дирекция'},
  'зам. директора':{scope:'вся компания · дашборды и аудит',           tier:'Дирекция'},
  'рук. ИЦ':       {scope:'инженерный центр + смежные (чтение)',       tier:'Руководитель'},
  'рук. продаж':   {scope:'отдел продаж + производство (чтение)',      tier:'Руководитель'},
  'рук. закупок':  {scope:'снабжение и ПП 719 + заказы (чтение)',      tier:'Руководитель'},
  'рук. логистики':{scope:'логистика и отгрузки + заказы',             tier:'Руководитель'},
  'инженер':       {scope:'свои задачи, БЗ, чертежи',                  tier:'Сотрудник'},
  'продажи':       {scope:'свои сделки, радар, портал',               tier:'Сотрудник'},
  'закупки':       {scope:'свои позиции снабжения, ПП 719',           tier:'Сотрудник'},
  'логист':        {scope:'свои отгрузки и комплектация',             tier:'Сотрудник'},
};
const ACC_MODS = ['CRM/Сделки','Заказы','Снабжение','Инж.центр','Финансы','Отчёты','Аудит','Доступы'];
const ACC = {
  'директор':      ['○','○','○','○','✓','✓','✓','✓'],
  'зам. директора':['○','○','○','○','✓','✓','✓','○'],
  'рук. ИЦ':       ['—','○','—','✓','—','○','—','—'],
  'рук. продаж':   ['✓','○','—','○','○','○','—','—'],
  'рук. закупок':  ['—','○','✓','—','—','○','—','—'],
  'рук. логистики':['—','✓','○','—','—','○','—','—'],
  'инженер':       ['—','○','—','✓','—','—','—','—'],
  'продажи':       ['✓','○','—','—','○','—','—','—'],
  'закупки':       ['—','○','✓','—','—','—','—','—'],
  'логист':        ['—','✓','○','—','—','—','—','—'],
};
/* доступные экраны по роли (реальное скрытие модулей в навигации) */
const ALL_VIEWS = ['today','deals','radar','estimates','flow','supply','ship','portal','board','ns','kb','notices','plan','reports','bench','team','settings'];
const ROLE_VIEWS = {
  'директор': ALL_VIEWS, 'зам. директора': ALL_VIEWS,
  'рук. ИЦ':        ['today','board','ns','kb','notices','plan','estimates','flow','reports','bench','team','settings'],
  'рук. продаж':    ['today','deals','radar','estimates','portal','flow','reports','bench','team','settings'],
  'рук. закупок':   ['today','supply','flow','ship','portal','reports','team','settings'],
  'рук. логистики': ['today','ship','flow','supply','portal','reports','team','settings'],
  'инженер':        ['today','board','ns','kb','notices','plan','estimates','flow','settings'],
  'продажи':        ['today','deals','radar','estimates','portal','flow','settings'],
  'закупки':        ['today','supply','ship','flow','portal','settings'],
  'логист':         ['today','ship','flow','supply','portal','settings'],
};
// Безопасность: неизвестная/опечатанная роль получает МИНИМАЛЬНЫЙ доступ (не ALL_VIEWS) —
// иначе опечатка в роли при приглашении = эскалация привилегий до полного доступа.
function canView(v){ const role=(PEOPLE[S.currentUser]||{}).role; const a=ROLE_VIEWS[role]||['today','settings']; return (v==='order'?(a.indexOf('flow')>=0):a.indexOf(v))>=0; }
/* финансовая видимость (маржа, суммы, ТКП): дирекция + продажи; остальным скрыто */
function canFin(){ const r=(PEOPLE[S.currentUser]||{}).role; return r==='директор'||r==='зам. директора'||r==='рук. продаж'||r==='продажи'; }
/* управленческие функции: интеграции, миграция, автоматизации, API — руководители и дирекция */
function canManage(){ const p=PEOPLE[S.currentUser]||{}; return p.lvl!=null && p.lvl<=2; }
/* администрирование: управление ролями/доступами и данными — только директор */
function canAdmin(){ return (PEOPLE[S.currentUser]||{}).role==='директор'; }
/* журнал аудита (кто, когда, что) — только дирекция, по матрице доступа */
function canAudit(){ const p=PEOPLE[S.currentUser]||{}; return p.lvl!=null && p.lvl<=1; }
function directReports(uid){ return Object.keys(PEOPLE).filter(k=>PEOPLE[k].mgr===uid); }
function subordinates(uid){ const out=[]; directReports(uid).forEach(d=>{ out.push(d); out.push.apply(out,subordinates(d)); }); return out; }
function orgTree(){
  const node=(uid,depth)=>{ const p=PEOPLE[uid]; const kids=directReports(uid); const sub=subordinates(uid).length;
    return `<div class="org-node" style="padding-left:${depth*22}px">
        <span class="av" style="background:${p.c}">${p.n}</span>
        <div class="on-main"><b>${esc(p.full)}</b> <span class="on-role">${esc(p.role)}</span>
          <span class="on-scope">${esc((ROLE_META[p.role]||{}).scope||'')}</span></div>
        ${sub?`<span class="on-sub">${sub} в подчинении</span>`:'<span class="on-sub muted">исполнитель</span>'}
      </div>` + kids.map(k=>node(k,depth+1)).join('');
  };
  const root=Object.keys(PEOPLE).find(k=>!PEOPLE[k].mgr)||'orlov';
  return `<div class="org-tree">${node(root,0)}</div>`;
}
function myTeamPanel(){
  const me=S.currentUser, p=PEOPLE[me]||{}; const reports=directReports(me); const all=subordinates(me);
  const mgr=p.mgr?PEOPLE[p.mgr]:null;
  const head=`<p style="font-size:13px;color:var(--ink2);margin:0 0 12px">Вы — <b>${esc(p.full)}</b> · ${esc(p.role)} <span class="stchip">${esc((ROLE_META[p.role]||{}).tier||'')}</span>${mgr?` · руководитель: <b>${esc(mgr.full)}</b> (${esc(mgr.role)})`:''}.</p>`;

      else { url='/api/auth/login'; payload={login:$('lgUser').value, password:$('lgPass').value};

      const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
      const j = await r.json().catch(()=>({}));
      if(r.ok){ location.reload(); return; }
      if(mode==='login' && j.totp_required){ $('lgTotpWrap').hidden=false; box.hidden=false; box.textContent=j.error||'Введите код из приложения'; btn.disabled=false; btn.textContent=label; const c=$('lgCode'); c.value=''; c.focus(); return; }
      fail(j.error || 'Не удалось');
    }catch(_){ fail('Сервер недоступен'); }
  });
}

// Роль вошедшего задаёт сервер, а не переключатель. Переключатель ролей — вещь
// демо: показать заводу, что видит логист и чего не видит. С настоящим входом
// человек обязан видеть ровно свои доступы, иначе RBAC — украшение.
function applyMe(u){
  const key = Object.keys(PEOPLE).find(k => k === u.login
              || (PEOPLE[k].role === u.role && PEOPLE[k].lvl === u.lvl));
  if(key){ S.currentUser = key; }
  else {
    // Учётки нет в демо-справочнике (реальный завод) — заводим на лету, чтобы
    // доступы считались по её роли, а не по чужой.
    PEOPLE[u.login] = {n:(u.name||'?').slice(0,2), full:u.name, role:u.role,
                       c:'#1F3A50', lvl:u.lvl, mgr:null, dept:'—'};
    S.currentUser = u.login;
  }
  S.demoRoleSwitch = false;      // с настоящим входом роль не выбирают
}

// Предупреждение о размере состояния. Замер: ~171 заказ с годовой лентой — и PUT
// начинает отдавать 413, после чего приложение не сохраняет НИЧЕГО и НИКОМУ.
// Запись в журнале аудита такое не остановит: её никто не читает до инцидента.
async function checkStateSize(){
  if(!SRV.on) return;
  try{
    const h = await (await fetch('/api/health', {cache:'no-store'})).json();
    const g = h.state; if(!g || g.level === 'ok'){ const b=$('stWarn'); if(b) b.remove(); return; }
    if($('stWarn')) return;
    const alarm = g.level === 'alarm';
    document.body.insertAdjacentHTML('afterbegin', `
      <div id="stWarn" class="stwarn ${alarm?'alarm':''}">
        <b>${alarm?'Скоро остановится сохранение':'Хранилище заполняется'}</b> —
        ${Math.round(g.bytes/1024)} КБ из ${Math.round(g.limit/1024)} КБ (${g.pct}%).
        При достижении предела изменения перестанут сохраняться у всех.
        Сообщите разработчику — нужен переезд на нормальное хранение.
        <button class="stwarn-x" data-stwarn-close="1" aria-label="Скрыть">✕</button>
      </div>`);
  }catch(e){ /* сервер недоступен — не наша забота здесь */ }
}

async function bootstrapSrv(){
  // Предпросмотр экрана входа на статичном демо (?preview=login): офлайн-демо вход не
  // показывает (сервера нет), но оценить первое впечатление можно без развёртывания.
  if(/[?&]preview=login/.test(location.search)){ try{ paintLogin(null, {oidc:true, bootstrap:true}); }catch(_){} return; }
  if(!/^https?:$/.test(location.protocol)) return;
  try{
    // Сначала «кто я» — этот роут анонимный, он и отвечает, нужен ли вход вообще.
    const who = await (await fetch('/api/auth/me', {cache:'no-store'})).json();
    if(who.auth && !who.user){
      let bootstrap=false;
      try{ const rs=await (await fetch('/api/auth/register-state',{cache:'no-store'})).json(); bootstrap=!!rs.bootstrap; }catch(_){}
      paintLogin(null, {oidc: who.oidc, bootstrap}); return;   // сервер требует вход
    }
    ME = who.user || null;
    TOTP2FA = !!who.totp;
    if(ME) applyMe(ME);
  }catch(e){ /* сервера нет — демо работает как раньше */ }
  try{
    const r = await fetch('/api/state', {cache:'no-store', headers:AH()});
    if(!r.ok) return;
    const j = await r.json();
    SRV.rev = j.rev || 0;
    if(j.data){ SYNCING = true; adoptShared(j.data); SYNCING = false; }
    else { SRV.on = true; ACTS.push('первичная загрузка демо-данных'); await pushState(); }
    setSrv(true); render();
    startStream();
    checkStateSize();                       // предел хранилища — узнать заранее, а не стеной
    setInterval(checkStateSize, 300000);
    setInterval(pullState, 30000); // страховочный редкий поллинг
  }catch(e){ setSrv(false); }
}

function dwgToLocal(clientX, clientY){
  const root = document.getElementById('dwgRoot');
  const svg = document.getElementById('dwgSvg');
  const pt = svg.createSVGPoint(); pt.x=clientX; pt.y=clientY;
  return pt.matrixTransform(root.getScreenCTM().inverse());
}
function dwgZoom(factor, cx, cy){
  const stage = $('dwgStage').getBoundingClientRect();
  const px = (cx==null? stage.left+stage.width/2 : cx), py = (cy==null? stage.top+stage.height/2 : cy);
  const before = dwgToLocal(px, py);
  DWG.s = Math.max(0.4, Math.min(8, DWG.s*factor));
  applyDwgTransform();
  const after = dwgToLocal(px, py);
  DWG.tx += (after.x-before.x)*DWG.s; DWG.ty += (after.y-before.y)*DWG.s;
  applyDwgTransform();
}
function applyDwgTransform(){
  const root=document.getElementById('dwgRoot');
  if(root) root.setAttribute('transform',`translate(${DWG.tx},${DWG.ty}) scale(${DWG.s})`);
  const z=document.getElementById('dwgZpct'); if(z) z.textContent=Math.round(DWG.s*100)+'%';   // индикатор зума без полного ре-рендера
}

function paramsByKind(text){
  text=text||''; const o={};
  let m;
  if(m=text.match(/\d+[.,]?\d*\s*бар/i)) o['Давление']=m[0].replace(/\s+/g,'');
  if(m=text.match(/\d+[.,]?\d*\s*м3?\/ч|\d+[.,]?\d*\s*м³\/ч/i)) o['Подача']=m[0].replace(/\s+/g,'').replace('³','3');
  if(m=text.match(/\d+[.,]?\d*\s*°?\s*[сcCС]\b/i)) o['Температура']=m[0].replace(/\s+/g,'');
  if(m=text.match(/ду\s?-?\s?\d+/i)) o['Условный проход']=m[0].toUpperCase().replace(/\s/g,'');
  [['бронз','бронза'],['титан','титан'],['нержав','нержавейка'],['латун','латунь'],['сталь','сталь']].forEach(([k,l])=>{ if(!o['Материал']&&new RegExp(k,'i').test(text))o['Материал']=l; });
  [['охлажд','охлаждение'],['топлив','топливо'],['масл','масло'],['забортн','забортная вода'],['сточн','стоки'],['баллас','балласт']].forEach(([k,l])=>{ if(!o['Среда']&&new RegExp(k,'i').test(text))o['Среда']=l; });
  return o;
}
function paramCompare(q,p){
  const mine=paramsByKind(q), ana=paramsByKind((p.tz||'')+' '+(p.tags||''));
  const keys=[...new Set([...Object.keys(mine),...Object.keys(ana)])];
  const rows=keys.map(k=>{ const a=mine[k]||null, b=ana[k]||null;
    const st=(a&&b)?(a.toLowerCase()===b.toLowerCase()?'match':'diff'):'partial';
    return {k, mine:a||'—', ana:b||'—', st}; });
  const matched=rows.filter(r=>r.st==='match').length, diff=rows.filter(r=>r.st==='diff').length;
  const conf=keys.length?Math.max(35,Math.min(96,Math.round((matched*1 + diff*0.45 + (keys.length-matched-diff)*0.2)/keys.length*100))):55;
  return {rows,conf,matched,diff,total:keys.length};
}
function kbEstimate(q,p){
  const c=paramCompare(q,p); const base=p.hours||40;
  const factor=1+c.diff*0.09;
  return { lo:Math.round(base*0.92), hi:Math.round(base*factor*1.12), conf:c.conf, cmp:c, base };
}

function animateCounters(){
  try{ if(matchMedia('(prefers-reduced-motion:reduce)').matches) return; }catch(e){ return; }
  document.querySelectorAll('#content .stat .v').forEach(el=>{
    const raw=el.textContent; const m=raw.match(/^(\D*)([\d\s]+(?:[.,]\d+)?)(.*)$/);
    if(!m) return; const pre=m[1], numStr=m[2].replace(/\s/g,'').replace(',','.'), post=m[3];
    const target=parseFloat(numStr); if(!isFinite(target)||target<=0) return;
    const dec=(numStr.split('.')[1]||'').length; const t0=performance.now(), dur=620;
    const fmt=v=>pre+(dec?v.toFixed(dec).replace('.',','):Math.round(v).toLocaleString('ru-RU'))+post;
    el.textContent=fmt(0);
    function step(t){ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3); el.textContent=fmt(target*e); if(p<1)requestAnimationFrame(step); else el.textContent=raw; }
    requestAnimationFrame(step);
  });
}

const ROI_FIELDS=[

  ['prevented_share','Снимаем ранней видимостью, %',40],
  ['rework_cases_year','Случаев перезакладки/дублей в год',6],
  ['rework_hours_case','Часов на разбор одного случая',40],
  ['prevented_rework','Ловит радар закладок, %',70],
];
function roiInputs(){ S.roiIn=S.roiIn||{}; const o={}; ROI_FIELDS.forEach(([k,,d])=>{ o[k]=(S.roiIn[k]!=null?S.roiIn[k]:d); }); return o; }
// Клиентский двойник roi.py.compute — целочисленно (Math.floor для //), digest-совместимо.
// Чтобы ROI считался и в офлайн-демо (заказчик видит рублёвую выгоду по своим числам без сервера).
function roiComputeClient(inp){
  const I=(v,d=0)=>{ const n=parseInt(v,10); return isNaN(n)?d:n; };
  const tz_m=Math.max(0,I(inp.tz_per_month)), h_before=Math.max(0,I(inp.hours_before)), h_after=Math.max(0,I(inp.hours_after));
  const rate_h=Math.max(0,I(inp.eng_rate_hour)), delay_day=Math.max(0,I(inp.delay_cost_day)), delay_days=Math.max(0,I(inp.delay_days_year));
  const prevented=Math.min(100,Math.max(0,I(inp.prevented_share)));
  const rework_cases=Math.max(0,I(inp.rework_cases_year)), rework_hours=Math.max(0,I(inp.rework_hours_case));
  const prevented_rework=Math.min(100,Math.max(0,I(inp.prevented_rework)));
  const tz_year=tz_m*12, hours_saved=Math.max(0,h_before-h_after);
  const eng_saved=tz_year*hours_saved*rate_h;
  const delay_saved=Math.floor(delay_day*delay_days*prevented/100);
  const rework_saved=Math.floor(rework_cases*rework_hours*rate_h*prevented_rework/100);
  const total=eng_saved+delay_saved+rework_saved;
  return { inputs:{tz_per_month:tz_m,hours_before:h_before,hours_after:h_after,eng_rate_hour:rate_h,delay_cost_day:delay_day,delay_days_year:delay_days,prevented_share:prevented,rework_cases_year:rework_cases,rework_hours_case:rework_hours,prevented_rework:prevented_rework},
    tz_per_year:tz_year, hours_saved_per_estimate:hours_saved, eng_hours_saved_year:tz_year*hours_saved,
    eng_saved_year:eng_saved, delay_saved_year:delay_saved, rework_saved_year:rework_saved, total_year:total };
}
async function roiCalc(){
  if(!SRV.on){ S.roi = roiComputeClient(roiInputs()); render(); return; }   // офлайн-демо: детерминированный клиентский расчёт
  try{ const r=await fetch('/api/roi',{method:'POST',headers:AH({'Content-Type':'application/json'}),body:JSON.stringify(roiInputs())});
    S.roi = r.ok ? await r.json() : roiComputeClient(roiInputs());
  }catch(_){ S.roi = roiComputeClient(roiInputs()); } render();
}

// Замыкание цикла: создать заказ по аналогу с преднаполненным составом (BOM аналога).
async function orderFromAnalog(analogId){
  const p=(S.kbProjects||[]).find(x=>x.id===analogId); if(!p){ toast('Аналог не найден','bad'); return; }
  const a=S.analog||{}; const est=a.estimate||{};
  S.seq=(S.seq||2470)+1; const num='З-'+S.seq;
  const o={id:'AN'+S.seq, num, title:(p.izdelie||'Изделие')+' (по ТЗ)', customer:'', vessel:'', due:'', sum:'', goz:0, igk:'', stage:0, risk:'ok',
    feed:[['сейчас','<b>Заказ создан по аналогу</b> «'+esc(p.izdelie||analogId)+'»'+(est.best!=null?', ориентир '+est.low+'–'+est.high+' н/ч':''),1]]};
  try{
    const r=await fetch('/api/order/from-analog',{method:'POST',headers:AH({'Content-Type':'application/json'}),body:JSON.stringify({analog_order:p.order||'', new_order:num})});
    const j=await r.json().catch(()=>({}));
    if(r.ok){ const b=j.bom||{};
      if((b.count||0)>0){ o.bomRef={digest:b.digest||'', count:b.count||0, docs:(j.cddoc||{}).count||0}; }
      o.feed.push(['сейчас', (b.count||0)>0?('Состав перенесён из аналога — '+b.count+' позиций, правьте под новое ТЗ'):'Состав аналога не загружен в БЗ — заполните состав вручную или из PLM', (b.count||0)>0?1:0]);
    } else toast(j.error||'Не удалось перенести состав','bad');
  }catch(_){ toast('Сервер недоступен — заказ создан без состава','bad'); }
  // Governance: заказ принят при ПЕРЕГРУЗКЕ ИЦ → осознанное решение фиксируется в ленту
  // (контроль над «продажи обещают вслепую») + заказ стартует как «риск срока».
  const icf=nsICForecast();
  if(icf.level==='over'){
    o.risk='warn';
    o.feed.push(['сейчас','⚠ <b>Принят при перегрузке ИЦ</b> — очередь '+icf.totalDays+' инженеро-дней, окно старта ~'+nsFmtDay(icf.startDay)+'. Осознанное решение: '+esc((PEOPLE[S.currentUser]||{}).full||S.currentUser)+'. Срок под риском.',0]);
    ACTS.push('заказ '+num+' принят при перегрузке ИЦ ('+icf.totalDays+' инженеро-дней)');
  }
  S.orders=S.orders||[]; S.orders.unshift(o); save();
  S.view='order'; S.orderId=o.id; render(); ensureL3(o.id);
  toast(icf.level==='over'?('Заказ '+num+' создан — ⚠ при перегрузке ИЦ (зафиксировано)'):('Заказ '+num+' создан по аналогу'),icf.level==='over'?'bad':'ok');
}

// Проверка реалистичности сроков: критерий не может завершиться РАНЬШЕ своего
// предшественника. Возвращает предшественника с самым поздним сроком, который

function nsItemConflict(st, it){
  if(it.status==='done' || !it.due) return null; const di=nsDay(it.due); if(di==null) return null;
  const byId={}; (st.items||[]).forEach(x=>{ byId[x.id]=x; });

    const dd=nsDay(dep.due); if(dd==null||di>=dd) return;              // di<dd → критерий раньше предшественника
    if(!worst||dd>nsDay(worst.due)) worst=dep; });

}

// Критический путь изделия: цепочка зависимостей, определяющая дату готовности.
// Терминал = критерий с самым поздним сроком; идём назад по предшественнику с самым
// поздним сроком. Ускорение на этой цепочке двигает срок сдачи, вне неё — нет.
function nsCriticalPath(st){
  const items=st.items||[]; if(!items.length) return []; const byId={}; items.forEach(x=>{ byId[x.id]=x; });
  // Длина пути к критерию = его длительность + макс. длина пути предшественника (учебный CPM).
  const LP={}, inProg={};
  function lp(id){ if(LP[id]!=null) return LP[id]; if(inProg[id]) return 0; inProg[id]=1;
    const deps=nsDepsFor(byId[id]).map(d=>byId[d]).filter(Boolean);
    const base=deps.length?Math.max.apply(null, deps.map(p=>lp(p.id))):0;
    LP[id]=base+nsDurFor(byId[id]); inProg[id]=0; return LP[id]; }
  let term=null, best=-1;
  items.forEach(it=>{ const v=lp(it.id); if(v>best){ best=v; term=it; } });
  if(!term) return [];
  const path=[term]; const seen=new Set([term.id]); let cur=term;
  while(true){
    const deps=nsDepsFor(cur).map(id=>byId[id]).filter(x=>x && !seen.has(x.id));
    if(!deps.length) break;
    let pick=deps[0]; deps.forEach(x=>{ if(lp(x.id)>lp(pick.id)) pick=x; });
    path.unshift(pick); seen.add(pick.id); cur=pick;
  }
  return path;
}

// Типовые длительности критериев (кал. дни, доменная оценка) — для авто-расстановки сроков.
const NS_DUR_DEFAULT = { d1:3, d2:3, d3:5, d4:3, d5:2, d6:4, d7:5, d8:4 };
function nsDurFor(it){ const d=(typeof it.dur==='number'&&it.dur>0)?it.dur:NS_DUR_DEFAULT[it.id]; return (typeof d==='number'&&d>0)?d : 3; }
// Авто-расстановка сроков от даты сдачи изделия НАЗАД по зависимостям (обратный проход
// CPM): срок критерия = его поздний финиш = min(поздний старт наследников). Гарантирует,
// что предшественник завершается раньше — план БЕЗ конфликтов. Экспертиза: руководитель
// задаёт дату сдачи, система строит реалистичную сетку сроков, а не вручную по одному.
function nsAutoSchedule(st, targetISO){
  const items=st.items||[]; if(!items.length) return 0;
  let T=nsDay(targetISO); if(T==null) return 0; T=nsPrevWork(T);   // сдача не в выходной
  const byId={}; items.forEach(x=>{ byId[x.id]=x; });
  const succ={}; items.forEach(it=>{ succ[it.id]=[]; });
  items.forEach(it=>{ nsDepsFor(it).forEach(d=>{ if(byId[d]) succ[d].push(it.id); }); });
  const LF={}, inProg={};
  // Поздний финиш: min по наследникам от их позднего старта = финиш − длительность

  function lf(id){ if(LF[id]!=null) return LF[id]; if(inProg[id]) return T; inProg[id]=1;  // guard от циклов
    const ss=succ[id]||[]; let v;
    if(!ss.length){ v=T; } else { v=Math.min.apply(null, ss.map(sid=>nsSubWork(lf(sid), nsDurFor(byId[sid])))); }

  items.forEach(it=>{ if(it.status==='done') return; const iso=nsISO(lf(it.id)); if(it.due!==iso){ it.due=iso; nsTouch(it); n++; } });

// Нагрузка инженера по всем изделиям: активные (не done) критерии, где он исполнитель,
// раскладка по срочности (просрочено / ≤7д / 8–14д / позже·без даты) + число изделий.
// Custdev: два инженера ведут несколько изделий параллельно — где пик, кто перегружен.
function nsEngineerLoad(u){
  const t=nsDay(todayISO());
  const res={u, stations:new Set(), overdue:[], soon:[], next:[], later:[]};
  nsList().forEach(st=>{ (st.items||[]).forEach(it=>{
    if(it.status==='done'||!nsCriterionMine(st,it,u)) return;
    res.stations.add(st.id); const d=nsDay(it.due); const rec={st,it,d};
    if(d==null) res.later.push(rec);
    else if(d<t) res.overdue.push(rec);
    else if(d-t<=7) res.soon.push(rec);
    else if(d-t<=14) res.next.push(rec);
    else res.later.push(rec);
  }); });
  [res.overdue,res.soon,res.next,res.later].forEach(a=>a.sort((x,y)=>(x.d==null?1:y.d==null?-1:x.d-y.d)));
  res.total=res.overdue.length+res.soon.length+res.next.length+res.later.length;

  res.days=[res.overdue,res.soon,res.next,res.later].reduce((s,a)=>s+a.reduce((z,r)=>z+nsDurFor(r.it),0),0);

// Прогноз доступности ИЦ для НОВОЙ работы (связка «продажи → ИЦ»). ЕДИНАЯ очередь ИЦ:
// проработка изделий + просчёты ТКП — оба типа работ на тех же инженеров. Общая загрузка в
// инженеро-днях, распределённая на инженеров → ближайшее окно старта. Клиентски (офлайн).
function nsICForecast(){

  const prorDays=[...ids].map(nsEngineerLoad).reduce((s,l)=>s+l.days,0);

  const estDays=Math.ceil(estHours/hpd);

  if(!name){ S._nsAddOpen=false; render(); return; }

// Комплект КД критерия: список документов {code, rev}. Ревизия — буквенная по ГОСТ 2.503

// прошлый формат «массив строк» → массив объектов. Компоновка порождает СБ+ГЧ+спецификацию.
const NS_REV_SEQ = ['','А','Б','В','Г','Д','Е','Ж','И','К','Л','М','Н','П','Р','С','Т','У','Ф'];  // ГОСТ 2.503 (без З,О,Ч и т.п.)

function nsArtNorm(a){ return (a && typeof a==='object') ? {code:String(a.code||''), rev:String(a.rev||'')} : {code:String(a||''), rev:''}; }
function nsArtifacts(it){
  if(Array.isArray(it.artifacts)) return it.artifacts.map(nsArtNorm);
  const a=it.artifact&&String(it.artifact).trim(); return a?[{code:a, rev:''}]:[];
}
function nsArtInit(it){ if(!Array.isArray(it.artifacts) || it.artifacts.some(a=>typeof a!=='object')){ it.artifacts=nsArtifacts(it); if('artifact' in it) delete it.artifact; } return it.artifacts; }
function nsAddArtifact(stId,itId){ const st=nsById(stId); if(!st) return;
  const it=(st.items||[]).find(x=>x.id===itId); if(!it) return;
  const v=(prompt('Обозначение документа комплекта КД критерия «'+(it.title||'')+'» (например СБ-2071-03, ГЧ-2071-01, спецификация):','')||'').trim();
  if(!v) return; nsArtInit(it); if(!it.artifacts.some(a=>a.code===v)){ st._demo=false; it.artifacts.push({code:v, rev:''}); nsLog(it,'КД + '+v); nsTouch(it); save(); render(); }
}
function nsDelArtifact(stId,itId,idx){ const st=nsById(stId); if(!st) return;
  const it=(st.items||[]).find(x=>x.id===itId); if(!it) return; nsArtInit(it);
  const removed=it.artifacts.splice(+idx,1)[0]; if(removed!==undefined){ nsLog(it,'КД − '+(removed.code||removed)); nsTouch(it); save(); render(); }

// Извещение об изменении по ГОСТ 2.503: бамп ревизии документа с причиной → в аудит.
function nsBumpRev(stId,itId,idx){ const st=nsById(stId); if(!st) return;
  const it=(st.items||[]).find(x=>x.id===itId); if(!it) return; nsArtInit(it);
  const a=it.artifacts[+idx]; if(!a) return;

  if(reason===null) return; const old=a.rev||'—'; a.rev=nsNextRev(a.rev);

function nsVerifyPrompt(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,.elx,application/json';
  inp.onchange=async()=>{ const f=inp.files&&inp.files[0]; if(!f) return;
    try{ const txt=await f.text(); const pkg=JSON.parse(txt);
      const body=pkg.body||pkg, sig=pkg.sig||'', pub=pkg.pub||'';
      if(!body||typeof body!=='object'||body.kind!=='elling-ns-snapshot'){ toast('Не похоже на снимок проработки изделий','bad'); return; }
      if(!SRV.on){   // офлайн: проверяем ЦЕЛОСТНОСТЬ пересчётом SHA-256 канона (детект подделки); подпись Ed25519 — на сервере
        const digest=await nsSha256Hex(nsCanon(body));
        const ok = pkg.digest ? (digest===pkg.digest) : true;
        S._nsVerify={valid:ok, body, digest, offline:true}; S.view='ns'; S.nsView='list'; render();
        toast(ok?'Целостность подтверждена — digest совпал':'Пакет изменён — digest НЕ совпал','ok'); return;
      }
      const r=await fetch('/api/order/snapshot/verify',{method:'POST',headers:AH({'Content-Type':'application/json'}),body:JSON.stringify({body,sig,pub})});
      const j=await r.json().catch(()=>({}));
      if(r.ok){ S._nsVerify={valid:!!j.valid, body, digest:j.digest||''}; S.view='ns'; S.nsView='list'; render();
        toast(j.valid?'Снимок подлинный ✔':'Подпись НЕ прошла — пакет изменён','ok'); }
      else toast(j.error||'Не удалось проверить','bad');
    }catch(_){ toast('Файл не читается или сервер недоступен','bad'); }
  };
  inp.click();
}

// Панель аудит-трейла: список изменений с прошлого снимка, сгруппировано по критериям.
function nsDiffPanel(st){

  const rows=d.changes.map(c=>{
    const body = c.t==='status' ? `${esc(c.from)} → <b style="color:${c.up?'var(--good)':'var(--warn)'}">${esc(c.to)}</b>`
      : c.t==='due' ? `срок ${esc(c.from)} → <b>${esc(c.to)}</b>`
      : esc(c.note||'');
    return `<div class="ns-diff-row"><span class="ns-diff-ic">${icon[c.t]||'•'}</span><span class="ns-diff-t">${esc(c.title)}</span><span class="ns-diff-b">${body}</span></div>`;
  }).join('');

// Канонический JSON как на бэкенде (sort_keys по code-points, без пробелов, ensure_ascii=false).
function nsCanon(o){
  if(o===null) return 'null';
  if(typeof o==='number') return String(o);
  if(typeof o==='boolean') return o?'true':'false';
  if(typeof o==='string') return JSON.stringify(o);
  if(Array.isArray(o)) return '['+o.map(nsCanon).join(',')+']';
  return '{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+nsCanon(o[k])).join(',')+'}';
}
async function nsSha256Hex(str){ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }

function nsDiffSince(st){
  const cp=(S.nsCheckpt||{})[st.id]; if(!cp) return null;
  const prev={}; (cp.items||[]).forEach(p=>prev[p.id]=p);
  const now=nsCheckptItems(st); const nowIds=new Set(now.map(n=>n.id));
  const ch=[];
  now.forEach(n=>{ const p=prev[n.id];
    if(!p){ ch.push({t:'new', title:n.title, note:'добавлен критерий · '+nsStLabel(n.status)}); return; }
    if(p.status!==n.status) ch.push({t:'status', title:n.title, from:nsStLabel(p.status), to:nsStLabel(n.status), up:NS_STATUS_ORDER.indexOf(n.status)>NS_STATUS_ORDER.indexOf(p.status)});
    if(p.due!==n.due) ch.push({t:'due', title:n.title, from:p.due||'—', to:n.due||'—'});
    if(p.dec!==n.dec) ch.push({t:'dec', title:n.title, note:'изменено решение'});
    // КД: сравнение комплекта по коду документа (ревизия A→Б, добавлен/убран документ)
    const pk={}; (p.kd||[]).forEach(k=>pk[k.code]=k.rev); const nk={}; (n.kd||[]).forEach(k=>nk[k.code]=k.rev);
    Object.keys(nk).forEach(code=>{ if(!(code in pk)) ch.push({t:'kd-add', title:n.title, note:'КД добавлена: '+code+(nk[code]?(' рев.'+nk[code]):'')});
      else if(pk[code]!==nk[code]) ch.push({t:'kd-rev', title:n.title, note:'КД '+code+': ревизия '+(pk[code]||'—')+'→'+(nk[code]||'—')}); });
    Object.keys(pk).forEach(code=>{ if(!(code in nk)) ch.push({t:'kd-del', title:n.title, note:'КД убрана: '+code}); });
  });
  (cp.items||[]).forEach(p=>{ if(!nowIds.has(p.id)) ch.push({t:'del', title:p.title, note:'критерий удалён'}); });

}

// UTC-парс (не локальный): согласован с nsFmtDay (форматирует через getUTC*) — иначе

function nsDay(iso){ if(!iso) return null; const t=Date.parse(iso+'T00:00:00Z'); return isFinite(t)?Math.floor(t/86400000):null; }
function nsFmtDay(day){ const d=new Date(day*86400000); return ('0'+d.getUTCDate()).slice(-2)+'.'+('0'+(d.getUTCMonth()+1)).slice(-2); }
function nsISO(day){ const d=new Date(day*86400000); return d.getUTCFullYear()+'-'+('0'+(d.getUTCMonth()+1)).slice(-2)+'-'+('0'+d.getUTCDate()).slice(-2); }
// День недели номера дня (epoch day 0 = 1970-01-01 = четверг). 0=вс … 6=сб.
function nsIsWeekend(day){ const dow=((day%7)+4+7)%7; return dow===0 || dow===6; }

// выходных устанавливаются ежегодным постановлением Правительства и здесь НЕ выводятся
// (нужен официальный производственный календарь); фиксированные праздники дают ~90% эффекта.
const NS_HOLIDAYS = new Set(['01-01','01-02','01-03','01-04','01-05','01-06','01-07','01-08','02-23','03-08','05-01','05-09','06-12','11-04']);
function nsMMDD(day){ const d=new Date(day*86400000); return ('0'+(d.getUTCMonth()+1)).slice(-2)+'-'+('0'+d.getUTCDate()).slice(-2); }
function nsIsNonWork(day){ return nsIsWeekend(day) || NS_HOLIDAYS.has(nsMMDD(day)); }  // выходной ИЛИ госпраздник
function nsPrevWork(day){ let d=day; while(nsIsNonWork(d)) d--; return d; }         // ближайший рабочий назад (вкл.)
function nsSubWork(day, n){ let d=day, left=n; while(left>0){ d--; if(!nsIsNonWork(d)) left--; } return d; }  // n рабочих дней назад
function nsAddWork(day, n){ let d=day, left=n; while(left>0){ d++; if(!nsIsNonWork(d)) left--; } return d; }  // n рабочих дней вперёд

function vNSTimeline(){

  const active=act.filter(it=>it.status==='wip'||it.status==='check'); if(active.length) return {k:'active', it:active[0]};

function kbSearchProjects(q){
  const tokens = (q||'').toLowerCase().split(/[^a-zа-яё0-9-]+/).filter(t=>t.length>1);
  if(!tokens.length) return [];
  const codeRe = /^[а-яёa-z]{1,4}[-–]?\d/i;
  return (S.kbProjects||[]).map(p=>{
    const text = (p.izdelie+' '+p.tz+' '+p.tags+' '+p.code).toLowerCase();
    const words = text.split(/[^a-zа-яё0-9-]+/);
    let score=0; const matched=[];
    tokens.forEach(t=>{
      let s=0;
      if(words.includes(t)) s=3; else if(words.some(w=>w.startsWith(t))) s=2; else if(text.includes(t)) s=1.2;
      if(s && codeRe.test(t)) s*=1.8;
      if(s){ score+=s; matched.push(t); }
    });
    const coverage = matched.length/tokens.length;
    const pct = Math.min(98, Math.round(score*coverage/(tokens.length*3)*100));
    const uniq = [...new Set(matched)];
    const factorOf = t => codeRe.test(t) ? 'обозначение'
      : (/^\d/.test(t) || /^(бар|мм|кв?т|°|м³|н\/ч)$/i.test(t) || /^ду-?\d/i.test(t)) ? 'параметр' : 'смысл';
    return { p, pct, matched:uniq, factors:uniq.map(t=>({t,k:factorOf(t)})) };
  }).filter(x=>x.pct>0).sort((a,b)=>b.pct-a.pct);
}
function extractTZParams(q){
  q=q||''; const out=[]; const add=v=>{ if(v&&!out.includes(v)) out.push(v); };
  (q.match(/\d+[.,]?\d*\s*бар/gi)||[]).forEach(x=>add('давление '+x.replace(/\s+/g,'').replace('бар',' бар')));
  (q.match(/\d+[.,]?\d*\s*м3?\/ч|\d+[.,]?\d*\s*м³\/ч/gi)||[]).forEach(x=>add('подача '+x.replace(/\s+/g,'')));
  (q.match(/\d+[.,]?\d*\s*°?\s*[сcCС]\b/gi)||[]).forEach(x=>add('температура '+x.replace(/\s+/g,'')));
  (q.match(/ду\s?-?\s?\d+/gi)||[]).forEach(x=>add('условный проход '+x.toUpperCase().replace(/\s/g,'')));
  [['бронз','материал: бронза'],['титан','материал: титан'],['сталь','материал: сталь'],['нержав','материал: нержавейка'],['латун','материал: латунь']].forEach(([k,l])=>{ if(new RegExp(k,'i').test(q)) add(l); });
  [['охлажд','среда: охлаждение'],['топлив','среда: топливо'],['масл','среда: масло'],['забортн','среда: забортная вода'],['сточн','среда: стоки'],['баллас','среда: балласт']].forEach(([k,l])=>{ if(new RegExp(k,'i').test(q)) add(l); });
  const code=(q.match(/[а-яёa-z]{2,4}[-–]?\d{2,4}/gi)||[]).filter(c=>!/^ду/i.test(c))[0];
  if(code) add('обозначение ~'+code.toUpperCase());
  return out;
}

function notify(userIds, text, taskKey, go){
  S.notes = S.notes || [];
  const nc = S.notifCh||{}; const ch = []; if(nc.mail) ch.push('почта'); if(nc.tg) ch.push('Telegram');

}

/* Движок: срабатывает при изменениях и по таймеру. Идемпотентен — каждое правило
   для задачи срабатывает один раз (ключ в t.autoFired, живёт на задаче и синкается),
   плюс контентные гварды на push, чтобы не задваивать при гонке между клиентами. */
function runAutomations(trigger, task){
  S.rules = S.rules || [];
  let changed = false;
  const fire = (rule, t, key) => {
    t.autoFired = t.autoFired || [];
    if(t.autoFired.includes(key)) return;
    t.autoFired.push(key); changed = true;
    const recips = [t.who, ...(t.watchers||[])];
    if(rule.act.comment){
      t.comments = t.comments||[];
      const cm = `Задача просрочена (срок ${t.due}). Требуется внимание.`;
      if(!t.comments.some(c=>c.a==='⚙ Автоматизация' && c.m===cm)) t.comments.push({a:'⚙ Автоматизация', m:cm});
    }
    if(rule.act.prio && t.prio!=='hi'){ t.prio='hi'; const pl='автоматизация: приоритет поднят до высокого'; if(!t.log.includes(pl)) t.log.push(pl); }
    if(rule.act.notify){
      // текст по триггеру ПРАВИЛА, а не по аргументу вызова (ревью v0.9)
      const txt = rule.trigger==='overdue' ? `просрочена: ${t.ttl.slice(0,50)}`
        : rule.trigger==='to_rev' ? `ждёт согласования: ${t.ttl.slice(0,50)}` : `изменилась: ${t.ttl.slice(0,50)}`;
      notify(rule.trigger==='to_rev' ? ['maksimov', ...recips] : recips, txt, t.key);
    }
    const lm = `автоматизация «${rule.name.slice(0,40)}»`;
    if(!t.log.includes(lm)) t.log.push(lm);
    ACTS.push(`автоматизация: ${rule.name.slice(0,30)} → ${t.key}`);
  };
  S.rules.filter(r=>r.enabled).forEach(rule=>{
    if(rule.trigger==='overdue'){
      S.tasks.forEach(t=>{ const di=dueInfo(t);
        if(di && di.over && !(rule.id==='R3' && !t.sla)) fire(rule, t, rule.id+':'+t.key+':'+t.due); });
    } else if(rule.trigger==='to_rev' && trigger==='to_rev' && task && task.col==='rev'){
      fire(rule, task, rule.id+':'+task.key+':rev:'+(task.log.length));
    } else if(rule.trigger==='ns_done'){
      // проработка изделия завершена (все критерии done) → однократно уведомить рук. ИЦ / поднять флаг
      nsList().forEach(st=>{ const items=st.items||[]; if(!items.length) return;
        if(!items.every(it=>it.status==='done')) return;
        st.autoFired = st.autoFired || []; const key=rule.id;
        if(st.autoFired.includes(key)) return;
        st.autoFired.push(key); changed=true;
        if(rule.act.notify){ try{ notify(['maksimov'], 'проработка изделия завершена: '+String(st.name||'').slice(0,50), null, 'ns'); }catch(_){} }
        ACTS.push('автоматизация: '+rule.name.slice(0,30)+' → '+String(st.name||''));
      });
    }
  });
  if(changed) save();
  return changed;
}

function moveTask(t,to,how){
  const old=t.col; t.col=to;
  t.log.push(`статус: ${STNAME[old]} → ${STNAME[to]} (${how||PEOPLE[S.currentUser].full})`);
  ACTS.push(`${t.key}: ${STNAME[old]} → ${STNAME[to]}`);
  const o = orderOfTask(t);
  if(o) o.feed.push(['сейчас',`<b>${t.key}</b>: ${STNAME[old]} → ${STNAME[to]} (${PEOPLE[t.who].full}) — видно всем без звонка`,1]);
  if(to==='rev') runAutomations('to_rev', t);
}
